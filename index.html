<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Racers</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: Arial;
}

canvas {
  display: block;
  margin: auto;
  background: #333;
}
#title {
    position: fixed;
    top: 10px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 24px;
    font-weight: bold;
    z-index: 100;
}

#fireButton {
    position: fixed;
    bottom: 30px;
    right: 25px;
    z-index: 100;
    background: red;
    color: white;
    border: 3px solid white;
    border-radius: 50%;
    width: 80px;
    height: 80px;
    font-size: 18px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="title">🏁 BATTLE RACERS 🏁</div>
<canvas id="game"></canvas>
<button id="fireButton">🔥 FIRE</button>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const car = {
  x: canvas.width / 2 - 25,
  y: canvas.height - 150,
  width: 50,
  height: 90,
  speed: 8
};

const bullets = [];
let score = 0;
  let health = 3;
  
  const enemies = [];
  
const explosions = [];
  
function spawnEnemy() {
    enemies.push({
        x: Math.random() * (canvas.width - 50),
        y: -100,
        width: 50,
        height: 90,
        speed: 3
    });
}

setInterval(spawnEnemy, 1500);
function drawEnemies() {
    for (let i = enemies.length - 1; i >= 0; i--) {
        let enemy = enemies[i];

        enemy.y += enemy.speed;
      enemy.y += enemy.speed;

if (
    enemy.x < car.x + car.width &&
    enemy.x + enemy.width > car.x &&
    enemy.y < car.y + car.height &&
    enemy.y + enemy.height > car.y
) {
    health -= 1;
  
  if (health < 0) {
  health = 0;
}
    enemies.splice(i, 1);
    continue;
}

        ctx.fillStyle = "blue";
        ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);

        if (enemy.y > canvas.height) {
            enemies.splice(i, 1);
        }
    }
}
function drawRoad() {
  ctx.fillStyle = "#555";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "white";
  ctx.lineWidth = 5;
  ctx.setLineDash([30, 30]);

  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(canvas.width / 2, canvas.height);
  ctx.stroke();

  ctx.setLineDash([]);
}

function drawCar() {
  ctx.fillStyle = "red";
  ctx.fillRect(car.x, car.y, car.width, car.height);

  ctx.fillStyle = "black";
  ctx.fillRect(car.x + 10, car.y + 15, 30, 25);

  ctx.fillStyle = "yellow";
  ctx.fillRect(car.x + 20, car.y - 12, 10, 20);
}

function shoot() {
  bullets.push({
    x: car.x + car.width / 2 - 3,
    y: car.y,
    width: 6,
    height: 15
  });
}
document.getElementById("fireButton").addEventListener("click", shoot);
function drawBullets() {
  ctx.fillStyle = "yellow";

  for (let i = bullets.length - 1; i >= 0; i--) {
    let bullet = bullets[i];
    bullet.y -= 10;

    ctx.fillRect(
      bullet.x,
      bullet.y,
      bullet.width,
      bullet.height
    );

    let hit = false;

    for (let j = enemies.length - 1; j >= 0; j--) {
      let enemy = enemies[j];

      if (
        bullet.x < enemy.x + enemy.width &&
        bullet.x + bullet.width > enemy.x &&
        bullet.y < enemy.y + enemy.height &&
        bullet.y + bullet.height > enemy.y
      ) {
        explosions.push({
    x: enemy.x + enemy.width / 2,
    y: enemy.y + enemy.height / 2,
    size: 10,
    life: 20
});
        enemies.splice(j, 1);
        score += 10;
        bullets.splice(i, 1);
        hit = true;
        break;
      }
    }

    if (!hit && bullet.y < 0) {
      bullets.splice(i, 1);
    }
  }
}
  function drawExplosions() {
    for (let i = explosions.length - 1; i >= 0; i--) {
        let explosion = explosions[i];

        ctx.beginPath();
        ctx.arc(explosion.x, explosion.y, explosion.size, 0, Math.PI * 2);
        ctx.fillStyle = "orange";
        ctx.fill();

        explosion.size += 2;
        explosion.life--;

        if (explosion.life <= 0) {
            explosions.splice(i, 1);
        }
    }
}
document.addEventListener("touchmove", function(e) {
  const touch = e.touches[0];
  car.x = touch.clientX - car.width / 2;
  e.preventDefault();
}, { passive: false });

function gameLoop() {
  drawRoad();
  drawEnemies();
  drawExplosions();
  drawCar();
  drawBullets();
  
  ctx.fillStyle = "white";
ctx.font = "bold 24px Arial";
ctx.fillText("SCORE: " + score, 20, 50);
  ctx.fillText("HEALTH: " + health, 20, 80);

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
