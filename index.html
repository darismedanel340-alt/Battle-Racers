<style>

*{

html,body{

  font-family:Arial,sans-serif;

/* =========================
   GAME CANVAS
========================= */

#game{

  inset:0;
  width:100vw;
  height:100vh;
  display:block;
  background:#071018;

}

/* =========================
   GAME TITLE
========================= */

#title{

  top:8px;
  left:0;

  text-align:center;
  color:white;
  font-size:24px;
  font-weight:bold;
  letter-spacing:2px;
  text-shadow:
    0 3px 8px #000,
    0 0 12px #4bc5ff;
  pointer-events:none;

}

/* =========================
   FIRE BUTTON
========================= */

#fireButton{

  right:25px;
  bottom:30px;

  width:88px;
  height:88px;

/* =========================

      "battleRacersSound",
      soundEnabled
      ?"on"
      :"off"
    );

    updateSoundButton();

  }
);

/* ==========================================
   WEB AUDIO ENGINE
========================================== */

let audioContext=null;

function getAudio(){

  if(!soundEnabled)
    return null;

  if(!audioContext){

    const AudioCtx=
    window.AudioContext||
    window.webkitAudioContext;

    if(!AudioCtx)
      return null;

    audioContext=
    new AudioCtx();

  }

  if(
    audioContext.state===
    "suspended"
  ){

    audioContext.resume();

  }

  return audioContext;

}

/* GENERATE SOUND WITHOUT AUDIO FILES */

function playTone(
  frequency=440,
  duration=.08,
  type="square",
  volume=.05,
  endFrequency=null
){

  if(!soundEnabled)
    return;

  const ac=getAudio();

  if(!ac)
    return;

  const oscillator=
  ac.createOscillator();

  const gain=
  ac.createGain();

  oscillator.type=type;

  oscillator.frequency
  .setValueAtTime(
    frequency,
    ac.currentTime
  );

  if(endFrequency){

    oscillator.frequency
    .exponentialRampToValueAtTime(
      Math.max(1,endFrequency),
      ac.currentTime+duration
    );

  }

  gain.gain
  .setValueAtTime(
    volume,
    ac.currentTime
  );

  gain.gain
  .exponentialRampToValueAtTime(
    .001,
    ac.currentTime+duration
  );

  oscillator.connect(gain);

  gain.connect(
    ac.destination
  );

  oscillator.start();

  oscillator.stop(
    ac.currentTime+
    duration
  );

}

      90

  }

}

/* LEVEL UP SOUND */

function playLevelSound(){

  const notes=[

    550,
    660,
    880
  ];

  notes.forEach(

      setTimeout(
        ()=>playTone(
          note,
          .12,
          "sine",
          .045
        ),
        index*90
      );

    }
  );

}

    tire=>
    tire.id===
    selectedTire
  )||
  shopTires[0];

}

function refreshWeaponStats(){

  const weapon=
  getSelectedWeapon();

  bulletDamage=
  weaponLevel+
  weapon.damageBonus;

  bulletSpeed=
  10+
  (weaponLevel-1)*2;

}

let previousLevel=1;

  if(

    level<5 ||
    level%5!==0 ||
    lastBossLevel===level
  ) return;

/* ==========================================
   BOSS MISSILES
========================================== */

function fireBossMissile(
  offsetX
){

  if(
    !boss ||
    health<=0
  ) return;

  const sx=
  boss.x+
  boss.width/2+
  offsetX;

  const sy=
  boss.y+
  boss.height;

  const tx=
  car.x+
  car.width/2;

  const ty=
  car.y+
  car.height/2;

  const dx=tx-sx;
  const dy=ty-sy;

  const len=
  Math.hypot(dx,dy)||1;

  const speed=3.4;

  enemyBullets.push({

    x:sx-6,
    y:sy,

    width:12,
    height:24,

    vx:
      (dx/len)*speed,

    vy:
      (dy/len)*speed,

    damage:1,

    bossShot:true,
    missile:true

  });

}

/* ==========================================
   BOSS NORMAL SHOT
========================================== */

function fireEnemyShot(
  shooter,
  bossShot=false
){

  if(
    !shooter ||
    health<=0
  ) return;

  const sx=
  shooter.x+
  shooter.width/2;

  const sy=
  shooter.y+
  shooter.height;

  const tx=
  car.x+
  car.width/2;

  const ty=
  car.y+
  car.height/2;

  const dx=tx-sx;
  const dy=ty-sy;

  const len=
  Math.hypot(dx,dy)||1;

  const speed=
  bossShot?5.2:2.2;

  enemyBullets.push({

    x:sx-4,
    y:sy,

    width:8,
    height:14,

    vx:
      (dx/len)*speed,

    vy:
      (dy/len)*speed,

    damage:
      bossShot?2:1,

    bossShot:
      bossShot

  });

}

/* ==========================================
   BOSS SHOOTING
========================================== */

function updateEnemyShooting(){

  if(
    !gameStarted ||
    countdownActive ||
    paused ||
    health<=0 ||
    shopPage.style.display===
    "block"
  ) return;

  if(boss){

    enemyShotTimer++;

    if(
      enemyShotTimer>=300
    ){

      enemyShotTimer=0;

      fireEnemyShot(
        boss,
        true
      );

    }

  }else{

    enemyShotTimer=0;

  }

}

/* ==========================================
   BOSS MINES + MISSILE ATTACK
========================================== */

function updateBossMines(){

  if(
    !gameStarted ||
    countdownActive ||
    paused ||
    health<=0
  ) return;

  if(!boss){

    bossMineTimer=0;
    bossWasActive=false;

    return;

  }

  if(!bossWasActive){

    bossWasActive=true;
    bossMineTimer=0;

  }

  bossMineTimer++;

  /* warning two seconds before attack */

  if(
    bossMineTimer===480
  ){

    bossAttackWarning=120;

    playTone(
      180,
      .18,
      "square",
      .05,
      90
    );

  }

  if(
    bossMineTimer>=600
  ){

    bossMineTimer=0;

    /* THREE MISSILES */

    [
      -boss.width*.28,
      0,
      boss.width*.28
    ].forEach(
      (offset,index)=>{

        setTimeout(()=>{

          if(
            boss &&
            gameStarted &&
            health>0
          ){

            fireBossMissile(
              offset
            );

          }

        },index*450);

      }
    );

    /* FIVE LAND MINES */

    for(
      let i=0;
      i<5;
      i++
    ){

      setTimeout(()=>{

        if(
          !boss ||
          !gameStarted ||
          health<=0
        ) return;

        const margin=35;

        const x=
        margin+
        Math.random()*
        Math.max(
          1,
          canvas.width-
          margin*2
        );

        bossMines.push({

          x:x-11,

          y:
            boss.y+
            boss.height+
            8,

          width:22,
          height:22,

          speed:2,

          life:900

        });

      },i*650);

    }

  }

}

/* ==========================================
   BOSS ATTACK WARNING
========================================== */

function drawBossAttackWarning(){

  if(
    bossAttackWarning<=0 ||
    !boss
  ) return;

  bossAttackWarning--;

  ctx.save();

  const pulse=
  .65+
  Math.abs(
    Math.sin(
      bossAttackWarning*.18
    )
  )*.35;

  ctx.globalAlpha=pulse;

  ctx.textAlign="center";

  ctx.font=
  "bold 22px Arial";

  ctx.fillStyle=
  "#ffef4a";

  ctx.strokeStyle=
  "rgba(0,0,0,.9)";

  ctx.lineWidth=5;

  const msg=
  "⚠ MISSILES + MINES INCOMING! ⚠";

  ctx.strokeText(
    msg,
    canvas.width/2,
    95
  );

  ctx.fillText(
    msg,
    canvas.width/2,
    95
  );

  ctx.restore();

}

/* ==========================================
   DRAW BOSS MINES
========================================== */

function drawBossMines(){

  for(
    let i=
    bossMines.length-1;
    i>=0;
    i--
  ){

    const m=
    bossMines[i];

    m.y+=m.speed;
    m.life--;

    ctx.save();

    /* shadow */

    ctx.fillStyle=
    "rgba(0,0,0,.4)";

    ctx.beginPath();

    ctx.ellipse(
      m.x+11,
      m.y+17,
      15,
      7,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    /* spikes */

    ctx.strokeStyle=
    "#bfc5c9";

    ctx.lineWidth=3;

    for(
      let a=0;
      a<8;
      a++
    ){

      const angle=
      a*Math.PI/4;

      ctx.beginPath();

      ctx.moveTo(
        m.x+11+
        Math.cos(angle)*8,
        m.y+11+
        Math.sin(angle)*8
      );

      ctx.lineTo(
        m.x+11+
        Math.cos(angle)*14,
        m.y+11+
        Math.sin(angle)*14
      );

      ctx.stroke();

    }

    /* mine */

    ctx.fillStyle=
    "#242424";

    ctx.beginPath();

    ctx.arc(
      m.x+11,
      m.y+11,
      10,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle=
    "#9aa0a6";

    ctx.lineWidth=2;
    ctx.stroke();

    /* blinking warning light */

    ctx.shadowBlur=12;

    ctx.shadowColor=
    "#ff2b00";

    ctx.fillStyle=
    Math.floor(m.life/12)%2
    ?"#ff3b18"
    :"#ffcf32";

    ctx.beginPath();

    ctx.arc(
      m.x+11,
      m.y+8,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();

    /* PLAYER COLLISION */

    if(
      m.x<
      car.x+car.width &&

      m.x+m.width>
      car.x &&

      m.y<
      car.y+car.height &&

      m.y+m.height>
      car.y
    ){

      health--;

      if(health<0)
        health=0;

      addBlastEffect(
        m.x+11,
        m.y+11,
        true
      );

      playExplosionSound(
        true
      );

      bossMines.splice(
        i,
        1
      );

      continue;

    }

    if(
      m.y>
      canvas.height+30 ||
      m.life<=0
    ){

      bossMines.splice(
        i,
        1
      );

    }

  }

}

/* ==========================================
   ENEMY BULLETS
========================================== */

function drawEnemyBullets(){

  for(
    let i=
    enemyBullets.length-1;
    i>=0;
    i--
  ){

    const b=
    enemyBullets[i];

    b.x+=b.vx;
    b.y+=b.vy;

    ctx.save();

    ctx.shadowBlur=
    b.bossShot?18:11;

    ctx.shadowColor=
    b.bossShot
    ?"#ff2b00"
    :"#ff9d00";

    if(b.missile){

      /* missile body */

      ctx.fillStyle=
      "#d8dde3";

      ctx.fillRect(
        b.x+3,
        b.y,
        6,
        17
      );

      /* missile nose */

      ctx.fillStyle=
      "#ff3b16";

      ctx.beginPath();

      ctx.moveTo(
        b.x+3,
        b.y
      );

      ctx.lineTo(
        b.x+9,
        b.y
      );

      ctx.lineTo(
        b.x+6,
        b.y-7
      );

      ctx.closePath();
      ctx.fill();

      /* missile flame */

      ctx.fillStyle=
      "#ffb000";

      ctx.beginPath();

      ctx.moveTo(
        b.x+3,
        b.y+17
      );

      ctx.lineTo(
        b.x+9,
        b.y+17
      );

      ctx.lineTo(
        b.x+6,
        b.y+28+
        Math.random()*5
      );

      ctx.closePath();
      ctx.fill();

    }else{

      ctx.fillStyle=
      b.bossShot
      ?"#ff3b16"
      :"#ffb31a";

      ctx.beginPath();

      ctx.arc(
        b.x+b.width/2,
        b.y+b.height/2,
        b.bossShot?6:4,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

    ctx.restore();

    /* HIT PLAYER */

    if(
      b.x<
      car.x+car.width &&

      b.x+b.width>
      car.x &&

      b.y<
      car.y+car.height &&

      b.y+b.height>
      car.y
    ){

      health-=b.damage;

      if(health<0)
        health=0;

      addBlastEffect(
        b.x+
        b.width/2,

        b.y+
        b.height/2,

        false
      );

      playExplosionSound(
        false
      );

      enemyBullets.splice(
        i,
        1
      );

      continue;

    }

    if(
      b.y>
      canvas.height+30 ||

      b.y<-30 ||

      b.x<-30 ||

      b.x>
      canvas.width+30
    ){

      enemyBullets.splice(
        i,
        1
      );

    }

  }

}

/* ==========================================
   ROAD + SCENERY
========================================== */

let sceneryOffset=0;

function drawRoad(){

  const w=canvas.width;
  const h=canvas.height;
  const horizon=h*.22;

  /* SKY */

  const sky=
  ctx.createLinearGradient(
    0,0,0,horizon+80
  );

  sky.addColorStop(
    0,
    "#3197d0"
  );

  sky.addColorStop(
    .65,
    "#9bdfff"
  );

  sky.addColorStop(
    1,
    "#eefaff"
  );

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,
    0,
    w,
    horizon+80
  );

  /* SUN */

  ctx.save();

  ctx.shadowBlur=30;
  ctx.shadowColor=
  "rgba(255,240,130,.8)";

  ctx.fillStyle=
  "#fff0a3";

  ctx.beginPath();

  ctx.arc(
    w*.78,
    h*.09,
    26,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

  /* DISTANT MOUNTAINS */

  ctx.fillStyle=
  "#668b80";

  ctx.beginPath();

  ctx.moveTo(
    0,
    horizon
  );

  for(
    let x=0;
    x<=w;
    x+=55
  ){

    const peak=
    horizon-
    (
      22+
      Math.abs(
        Math.sin(x*.021)
      )*65
    );

    ctx.lineTo(
      x,
      peak
    );

  }

  ctx.lineTo(
    w,
    horizon
  );

  ctx.closePath();
  ctx.fill();

  /* DARK MOUNTAINS */

  ctx.fillStyle=
  "#365b50";

  ctx.beginPath();

  ctx.moveTo(
    0,
    horizon+18
  );

  for(
    let x=0;
    x<=w;
    x+=70
  ){

    ctx.lineTo(
      x,
      horizon-
      15-
      Math.abs(
        Math.cos(x*.017)
      )*35
    );

  }

  ctx.lineTo(
    w,
    horizon+18
  );

  ctx.closePath();
  ctx.fill();

  /* OCEAN */

  const ocean=

  ctx.createLinearGradient(
    0,
    horizon,
    0,
    h
  );

  ocean.addColorStop(
    0,
    "#26a8c7"
  );

  ocean.addColorStop(
    1,
    "#075a7b"
  );

  ctx.fillStyle=ocean;

  ctx.fillRect(
    0,
    horizon,
    w,
    h-horizon
  );

  /* OCEAN SHIMMER */

  ctx.strokeStyle=
  "rgba(255,255,255,.22)";

  ctx.lineWidth=2;

  for(
    let y=horizon+20;
    y<h;
    y+=34
  ){

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      w,
      y
    );

    ctx.stroke();

  }

  /* ROAD */

  const topL=w*.38;
  const topR=w*.62;

  const botL=w*.08;
  const botR=w*.92;

  const asphalt=
  ctx.createLinearGradient(
    0,
    horizon,
    0,
    h
  );

  asphalt.addColorStop(
    0,
    "#5e6468"
  );

  asphalt.addColorStop(
    .45,
    "#3d4247"
  );

  asphalt.addColorStop(
    1,
    "#202429"
  );

  ctx.fillStyle=
  asphalt;

  ctx.beginPath();

  ctx.moveTo(
    topL,
    horizon
  );

  ctx.lineTo(
    topR,
    horizon
  );

  ctx.lineTo(
    botR,
    h
  );

  ctx.lineTo(
    botL,
    h
  );

  ctx.closePath();
  ctx.fill();

  /* ROAD EDGES */

  ctx.strokeStyle=
  "#ededed";

  ctx.lineWidth=12;

  ctx.beginPath();

  ctx.moveTo(
    topL,
    horizon
  );

  ctx.lineTo(
    botL,
    h
  );

  ctx.moveTo(
    topR,
    horizon
  );

  ctx.lineTo(
    botR,
    h
  );

  ctx.stroke();

  /* RED RACING EDGE */

  ctx.strokeStyle=
  "#e53935";

  ctx.lineWidth=6;

  ctx.setLineDash(
    [30,25]
  );

  ctx.lineDashOffset=
  -sceneryOffset;

  ctx.beginPath();

  ctx.moveTo(
    topL,
    horizon
  );

  ctx.lineTo(
    botL,
    h
  );

  ctx.moveTo(
    topR,
    horizon
  );

  ctx.lineTo(
    botR,
    h
  );

  ctx.stroke();

  /* LANE MARKINGS */

  ctx.strokeStyle=
  "rgba(255,255,255,.94)";

  ctx.lineWidth=5;

  ctx.setLineDash(
    [40,46]
  );

  ctx.lineDashOffset=
  -sceneryOffset;

  for(
    const fraction of
    [1/3,2/3]
  ){

    ctx.beginPath();

    ctx.moveTo(
      topL+
      (topR-topL)*
      fraction,
      horizon
    );

    ctx.lineTo(
      botL+
      (botR-botL)*
      fraction,
      h
    );

    ctx.stroke();

  }

  ctx.setLineDash([]);

  /* GUARD RAILS */

  ctx.strokeStyle=
  "#cbd3d8";

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(
    topL-18,
    horizon
  );

  ctx.lineTo(
    botL-22,
    h
  );

  ctx.moveTo(
    topR+18,
    horizon
  );

  ctx.lineTo(
    botR+22,
    h
  );

  ctx.stroke();

  /* PALM TREES */

  ctx.strokeStyle=
  "#153d22";

  ctx.fillStyle=
  "#153d22";

  for(
    let x=45;
    x<w;
    x+=150
  ){

    if(
      x>w*.28 &&
      x<w*.72
    ) continue;

    const py=
    horizon+
    48+
    (x%4)*8;

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(
      x,
      py
    );

    ctx.lineTo(
      x+2,
      py-48
    );

    ctx.stroke();

    for(
      let a=0;
      a<6;
      a++
    ){

      const ang=
      (
        Math.PI*2/6
      )*a;

      ctx.beginPath();

      ctx.moveTo(
        x+2,
        py-48
      );

      ctx.lineTo(
        x+2+
        Math.cos(ang)*24,

        py-48+
        Math.sin(ang)*13
      );

      ctx.stroke();

    }

  }

  if(
    gameStarted &&
    !paused &&
    !countdownActive
  ){

    sceneryOffset=
    (
      sceneryOffset+7
    )%500;

  }

}


/* ==========================================
   PLAYER CAR
========================================== */

function drawCar(){

  const x=car.x;
  const y=car.y;

  const w=car.width;
  const h=car.height;

  ctx.save();

  /* SHADOW */

  ctx.fillStyle=
  "rgba(0,0,0,.48)";

  ctx.beginPath();

  ctx.ellipse(
    x+w/2,
    y+h*.70,
    w*.70,
    h*.38,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* TIRES */

  ctx.fillStyle=
  "#050505";

  ctx.fillRect(
    x-6,
    y+h*.18,
    9,
    h*.28
  );

  ctx.fillRect(
    x+w-3,
    y+h*.18,
    9,
    h*.28
  );

  ctx.fillRect(
    x-6,
    y+h*.62,
    9,
    h*.26
  );

  ctx.fillRect(
    x+w-3,
    y+h*.62,
    9,
    h*.26
  );

  /* CAR BODY */

  const body=
  ctx.createLinearGradient(
    x,
    y,
    x+w,
    y+h
  );

  body.addColorStop(
    0,
    "#ffffff"
  );

  body.addColorStop(
    .13,
    carColor
  );

  body.addColorStop(
    .70,
    carColor
  );

  body.addColorStop(
    1,
    "#080808"
  );

  ctx.fillStyle=
  body;

  ctx.beginPath();

  ctx.moveTo(
    x+w*.22,
    y
  );

  ctx.lineTo(
    x+w*.78,
    y
  );

  ctx.quadraticCurveTo(
    x+w,
    y+h*.14,
    x+w,
    y+h*.48
  );

  ctx.lineTo(
    x+w*.90,
    y+h*.92
  );

  ctx.lineTo(
    x+w*.10,
    y+h*.92
  );

  ctx.lineTo(
    x,
    y+h*.48
  );

  ctx.quadraticCurveTo(
    x,
    y+h*.14,
    x+w*.22,
    y
  );

  ctx.closePath();
  ctx.fill();

  /* CENTER RACING STRIPE */

  ctx.fillStyle=
  "rgba(255,255,255,.20)";

  ctx.fillRect(
    x+w*.46,
    y+4,
    w*.08,
    h*.82
  );

  /* WINDSHIELD */

  const glass=
  ctx.createLinearGradient(
    0,
    y+h*.25,
    0,
    y+h*.56
  );

  glass.addColorStop(
    0,
    "#b8efff"
  );

  glass.addColorStop(
    1,
    "#061c2a"
  );

  ctx.fillStyle=
  glass;

  ctx.beginPath();

  ctx.roundRect(
    x+w*.18,
    y+h*.28,
    w*.64,
    h*.27,
    6
  );

  ctx.fill();

/* ==========================================
   COMBAT EFFECTS
========================================== */

function addMuzzleFlash(x,y){
  muzzleFlashes.push({
    x:x,
    y:y,
    life:7,
    max:7
  });
}

function addImpactSpark(x,y){

  for(let i=0;i<10;i++){

    const angle=
      Math.random()*
      Math.PI*2;

    const speed=
      1.5+
      Math.random()*4;

    impactSparks.push({
      x:x,
      y:y,

      vx:
        Math.cos(angle)*
        speed,

      vy:
        Math.sin(angle)*
        speed,

      life:16,
      max:16
    });

  }

  }

function addBlastEffect(
  x,
  y,
  big=false
){

  blastEffects.push({
    x:x,
    y:y,

    life:
      big?32:22,

    max:
      big?32:22,

    big:big
  });

  const amount=
    big?24:12;

  for(let i=0;i<amount;i++){

    const angle=
      Math.random()*
      Math.PI*2;

    const speed=
      1+
      Math.random()*
      (big?6:4);

    particles.push({

      x:x,
      y:y,

      vx:
        Math.cos(angle)*
        speed,

      vy:
        Math.sin(angle)*
        speed,

      size:
        2+
        Math.random()*4,

      life:
        20+
        Math.random()*20,

      max:40

    });

  }

}


/* ==========================================
   DRAW COMBAT EFFECTS
========================================== */

function updateAndDrawCombatEffects(){

  ctx.save();

  /* MUZZLE FLASH */

  for(
    let i=
      muzzleFlashes.length-1;
    i>=0;
    i--
  ){

    const f=
      muzzleFlashes[i];

    const alpha=
      f.life/f.max;

    ctx.globalAlpha=
      alpha;

    const radius=
      10+
      (1-alpha)*18;

    const gradient=
      ctx.createRadialGradient(
        f.x,
        f.y,
        0,

        f.x,
        f.y,
        radius
      );

    gradient.addColorStop(
      0,
      "#ffffff"
    );

    gradient.addColorStop(
      .25,
      "#fff36b"
    );

    gradient.addColorStop(
      .65,
      "#ff8a00"
    );

    gradient.addColorStop(
      1,
      "rgba(255,50,0,0)"
    );

    ctx.fillStyle=
      gradient;

    ctx.beginPath();

    ctx.arc(
      f.x,
      f.y,
      radius,
      0,
      Math.PI*2
    );

    ctx.fill();

    f.life--;

    if(f.life<=0){

      muzzleFlashes.splice(
        i,
        1
      );

    }

  }

  /* IMPACT SPARKS */

  for(
    let i=
      impactSparks.length-1;
    i>=0;
    i--
  ){

    const p=
      impactSparks[i];

    ctx.globalAlpha=
      p.life/p.max;

    ctx.fillStyle=
      p.life>8
      ?"#fff176"
      :"#ff6d00";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      2.5,
      0,
      Math.PI*2
    );

    ctx.fill();

    p.x+=p.vx;
    p.y+=p.vy;

    p.vx*=.94;
    p.vy*=.94;

    p.life--;

    if(p.life<=0){

      impactSparks.splice(
        i,
        1
      );

    }

  }

  /* EXPLOSIONS */

  for(
    let i=
      blastEffects.length-1;
    i>=0;
    i--
  ){

    const b=
      blastEffects[i];

    const progress=
      1-
      b.life/b.max;

    const radius=
      (
        b.big?55:32
      )*
      progress+
      8;

    ctx.globalAlpha=
      Math.max(
        0,
        1-progress
      );

    const gradient=
      ctx.createRadialGradient(
        b.x,
        b.y,
        0,

        b.x,
        b.y,
        radius
      );

    gradient.addColorStop(
      0,
      "#ffffff"
    );

    gradient.addColorStop(
      .16,
      "#fff36a"
    );

    gradient.addColorStop(
      .42,
      "#ff9d00"
    );

    gradient.addColorStop(
      .67,
      "#ff3b00"
    );

    gradient.addColorStop(
      .85,
      "#6d1500"
    );

    gradient.addColorStop(
      1,
      "rgba(20,20,20,0)"
    );

    ctx.fillStyle=
      gradient;

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      radius,
      0,
      Math.PI*2
    );

    ctx.fill();

    b.life--;

    if(b.life<=0){

      blastEffects.splice(
        i,
        1
      );

    }

  }

  /* DEBRIS PARTICLES */

  for(
    let i=
      particles.length-1;
    i>=0;
    i--
  ){

    const p=
      particles[i];

    ctx.globalAlpha=
      Math.max(
        0,
        p.life/p.max
      );

    ctx.fillStyle=
      p.life>20
      ?"#ffb000"
      :"#454545";

    ctx.fillRect(
      p.x,
      p.y,
      p.size,
      p.size
    );

    p.x+=p.vx;
    p.y+=p.vy;

    p.vx*=.96;

    p.vy=
      p.vy*.96+
      .05;

    p.life--;

    if(p.life<=0){

      particles.splice(
        i,
        1
      );

    }

  }

  ctx.globalAlpha=1;

  ctx.restore();

}


/* ==========================================
   SHOOTING
========================================== */

function shoot(){

  if(
    !gameStarted ||
    countdownActive ||
    paused ||
    health<=0 ||
    shopPage.style.display===
    "block"
  ) return;

  const weapon=
    getSelectedWeapon();

  const startX=
    car.x+
    car.width/2;

  const startY=
    car.y-8;

  let target=null;
  let bestDistance=
    Infinity;

  /* TARGET BOSS */

  if(
    boss &&
    boss.y<car.y
  ){

    target=boss;

    bestDistance=
      car.y-
      boss.y;

  }

  /* TARGET NEAREST ENEMY */

  for(const enemy of enemies){

    if(
      enemy.y<
      car.y
    ){

      const distance=
        car.y-
        enemy.y;

      if(
        distance<
        bestDistance
      ){

        bestDistance=
          distance;

        target=
          enemy;

      }

    }

  }

  function createBullet(
    offsetX=0,
    angleOffset=0
  ){

    const sx=
      startX+
      offsetX;

    let vx=0;
    let vy=
      -bulletSpeed;

    if(target){

      const tx=
        target.x+
        target.width/2;

      const ty=
        target.y+
        target.height/2;

      const dx=
        tx-sx;

      const dy=
        ty-startY;

      const length=
        Math.hypot(
          dx,
          dy
        )||1;

      vx=
        (
          dx/length
        )*
        bulletSpeed;

      vy=
        (
          dy/length
        )*
        bulletSpeed;

    }

    if(angleOffset!==0){

      const cos=
        Math.cos(
          angleOffset
        );

      const sin=
        Math.sin(
          angleOffset
        );

      const oldVx=vx;
      const oldVy=vy;

      vx=
        oldVx*cos-
        oldVy*sin;

      vy=
        oldVx*sin+
        oldVy*cos;

    }

    bullets.push({

      x:sx-3,
      y:startY,

      width:
        weapon.id==="champion"
        ?8
        :6,

      height:
        weapon.id==="laser"
        ?24
        :16,

      vx:vx,
      vy:vy,

      weapon:
        weapon.id

    });

  }

  /* DIFFERENT WEAPON TYPES */

  if(
    weapon.id==="twin"
  ){

    createBullet(-8);
    createBullet(8);

  }else if(
    weapon.id==="champion"
  ){

    createBullet(0);

    createBullet(
      -7,
      -.055
    );

    createBullet(
      7,
      .055
    );

  }else{

    createBullet(0);

  }

  addMuzzleFlash(
    startX,
    startY
  );

  playGunSound();

  /* RAPID FIRE POWERUP */

  if(rapidFire){

    setTimeout(()=>{

      if(
        gameStarted &&
        !paused &&
        health>0
      ){

        createBullet(0);

      }

    },75);

  }

}


/* ==========================================
   FIRE BUTTON
========================================== */

const fireButton=
  document.getElementById(
    "fireButton"
  );

let fireInterval=null;
let firingPointerId=null;

function startFiring(e){

  e.preventDefault();

  if(
    firingPointerId!==null
  ) return;

  firingPointerId=
    e.pointerId;

  try{

    fireButton
    .setPointerCapture(
      e.pointerId
    );

  }catch(error){}

  shoot();

  fireInterval=
    setInterval(()=>{

      if(
        gameStarted &&
        !paused &&
        !countdownActive &&
        health>0
      ){

        shoot();

      }

    },
    getSelectedWeapon()

    setInterval(()=>{

  }catch(error){console.warn("Canvas resolution:",error)}

  const oldRoad=drawRoad;
  drawRoad=function(){
    if(!ready(road)){oldRoad();return}
    const w=canvas.width,h=canvas.height;
    const scale=Math.max(w/road.width,h/road.height);
    const sw=w/scale,sh=h/scale;
    ctx.drawImage(road,(road.width-sw)/2,(road.height-sh)/2,sw,sh,0,0,w,h);
    if(gameStarted&&!paused&&!countdownActive&&health>0)
      sceneryOffset=(sceneryOffset+7)%500;
    ctx.save();
    for(let i=0;i<5;i++){
      const depth=(i/5+sceneryOffset/650)%1;
      const y=h*(.29+.71*depth*depth);
      ctx.globalAlpha=.12*depth;ctx.strokeStyle="#fff";ctx.lineWidth=2+depth*4;
      ctx.beginPath();ctx.moveTo(w/2,y);ctx.lineTo(w/2,y+12+depth*32);ctx.stroke();
    }
    ctx.restore();
  };

  const oldCar=drawCar;
  drawCar=function(){
    if(!ready(racer)){oldCar();return}
    // Keep the racer above the bottom shop bar on portrait phones.
    // Move the collision box with the image so hits remain aligned.
    if(canvas.width<canvas.height&&canvas.height>600)
      car.y=canvas.height-205;
    const w=Math.min(canvas.width*.37,165),h=w*1.05;
    const x=car.x+car.width/2-w/2,y=car.y+car.height*.7-h*.7;
    ctx.save();
    ctx.fillStyle="#0008";ctx.beginPath();
    ctx.ellipse(x+w/2,y+h*.85,w*.41,h*.17,0,0,Math.PI*2);ctx.fill();
    if(gameStarted&&health>0&&!paused&&!countdownActive){
      ctx.shadowBlur=18;ctx.shadowColor="#3cecff";ctx.fillStyle="#73e9ff";
      for(const fx of [.35,.65]){
        ctx.beginPath();ctx.moveTo(x+w*fx-5,y+h*.87);
        ctx.lineTo(x+w*fx,y+h*(1.08+Math.random()*.06));

        ctx.lineTo(x+w*fx+5,y+h*.87);ctx.fill();
      }
    }
    sprite(ctx,x,y,w,h,carColor);ctx.restore();
  };

  // Preserve all existing movement, collision, and damage behavior.
  const oldEnemies=drawEnemies;
  // The background is a photo: the visible road starts well below the sky.
  // These positions are fractions of the actual canvas after cover cropping.
  const roadSections=[
    [0,.52,.005],[.28,.52,.015],[.36,.50,.035],
    [.44,.46,.08],[.55,.49,.16],[.72,.50,.27],
    [1,.50,.40]
  ];
  const trafficLanes=[-.56,0,.56];
  function roadPosition(y,lane){
    const depth=Math.max(0,Math.min(1,y/canvas.height));
    let a=roadSections[0],b=roadSections[roadSections.length-1];
    for(let i=1;i<roadSections.length;i++){
      if(depth<=roadSections[i][0]){a=roadSections[i-1];b=roadSections[i];break}
    }
    const mix=(depth-a[0])/(b[0]-a[0]);
    return canvas.width*(a[1]+(b[1]-a[1])*mix+
      lane*(a[2]+(b[2]-a[2])*mix));
  }
  function stayOnRoad(object){
    const now=performance.now();
    if(object.roadLane===undefined){
      object.roadLane=trafficLanes[Math.floor(Math.random()*trafficLanes.length)];
      object.targetRoadLane=object.roadLane;
      object.nextLaneChange=now+1200+Math.random()*1800;
      object.weavePhase=Math.random()*Math.PI*2;
    }

    const oldLane=object.roadLane;
    if(typeof object.health==="number" && now>=object.nextLaneChange){
      const current=trafficLanes.indexOf(object.targetRoadLane);
      const options=[current-1,current+1].filter(i=>i>=0&&i<trafficLanes.length);
      object.targetRoadLane=trafficLanes[options[Math.floor(Math.random()*options.length)]];
      object.nextLaneChange=now+(object.strong?2600:1500)+Math.random()*1800;
    }

    if(typeof object.health==="number")
      object.roadLane+=(object.targetRoadLane-object.roadLane)*.025;

    object.roadLaneDelta=object.roadLane-oldLane;
    const weave=typeof object.health==="number"
      ?Math.sin(now*.0015+object.weavePhase)*.018:0;
    object.x=roadPosition(object.y+object.height/2,object.roadLane+weave)-object.width/2;
  }
  drawEnemies=function(){
    if(!ready(racer)){oldEnemies();return}
    enemies.forEach(stayOnRoad);
    ctx.save();ctx.globalAlpha=0;oldEnemies();ctx.restore();
    enemies.forEach((e,i)=>{
      // Cars are behind the distant bend until they reach the painted road.
      if(e.y<canvas.height*.32||e.y>canvas.height-90)return;
      const depth=Math.max(0,Math.min(1,e.y/canvas.height));
      const scale=.43+.75*depth;
      const w=(e.strong?70:58)*scale,h=(e.strong?83:72)*scale;
      ctx.save();
      ctx.translate(e.x+e.width/2,e.y+h/2);
      ctx.rotate(Math.max(-.10,Math.min(.10,-(e.roadLaneDelta||0)*3)));
      sprite(ctx,-w/2,-h/2,w,h,
        e.strong?"orange":["blue","green","purple"][i%3]);
      ctx.restore();
      if(e.strong){
        ctx.fillStyle="#06131fdc";ctx.fillRect(e.x,e.y-9,e.width,5);
        ctx.fillStyle="#4dff63";
        ctx.fillRect(e.x,e.y-9,e.width*Math.max(0,e.health/3),5);
      }
    });
  };
  const oldPowerUps=drawPowerUps;
  drawPowerUps=function(){
    powerUps.forEach(stayOnRoad);
    const hidden=powerUps.filter(p=>p.y<canvas.height*.32);
    if(!hidden.length){oldPowerUps();return}
    for(const p of hidden){
      powerUps.splice(powerUps.indexOf(p),1);
      p.y+=p.speed;
    }
    oldPowerUps();
    powerUps.push(...hidden);
  };
  const oldBoss=drawBoss;
  drawBoss=function(){
    if(!boss||!ready(racer)){oldBoss();return}
    ctx.save();ctx.globalAlpha=0;oldBoss();ctx.restore();
    if(!boss)return;
    ctx.save();ctx.shadowBlur=23;ctx.shadowColor="#ff351e";
    sprite(ctx,boss.x-10,boss.y-8,boss.width+20,boss.height+12,"red");
    ctx.restore();
    const bw=Math.min(canvas.width-40,420),bx=(canvas.width-bw)/2;
    ctx.fillStyle="#09121de8";ctx.fillRect(bx,54,bw,24);
    ctx.fillStyle="#ff4730";ctx.fillRect(bx+2,56,
      Math.max(0,boss.health/boss.maxHealth*(bw-4)),20);
    ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.strokeRect(bx,54,bw,24);
    ctx.fillStyle="#fff";ctx.font="bold 14px Arial";ctx.textAlign="center";
    ctx.fillText("BOSS  "+Math.ceil(boss.health)+" / "+boss.maxHealth,
      canvas.width/2,72);
  };

  const oldCard=createShopCard;
  createShopCard=function(item,owned,selected,action){
    oldCard(item,owned,selected,action);
    if(!shopCars.includes(item)||!ready(racer))return;
    const preview=shopGrid.lastElementChild?.querySelector(".shopPreview");
    if(!preview)return;
    const sample=document.createElement("canvas");
    sample.width=180;sample.height=190;
    sample.setAttribute("aria-label",item.name+" preview");
    const g=sample.getContext("2d");g.scale(2,2);
    sprite(g,6,2,78,87,item.id);preview.replaceChildren(sample);
  };
  racer.addEventListener("load",()=>{
    if(shopPage.style.display==="block"&&shopTitle.textContent.includes("CAR"))
      renderCars();
  });

  drawHUD=function(){
    ctx.save();
    const tw=canvas.width<600?125:160,th=30;
    const labels=["🏆 SCORE","🏁 LEVEL","🪙 COINS","❤️ HEALTH"];
    const values=[score,level,coins,"▰".repeat(Math.max(0,health))||"0"];
    for(let i=0;i<4;i++){
      const y=52+i*(th+4);
      ctx.fillStyle="rgba(3,22,36,.78)";
      ctx.beginPath();ctx.roundRect(10,y,tw,th,8);ctx.fill();
      ctx.strokeStyle="#6c9dbb";ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle="#cce6f5";ctx.font="bold 10px Arial";ctx.textAlign="left";
      ctx.fillText(labels[i],17,y+12);
      ctx.fillStyle=i===3?"#71fd67":"#fff";
      ctx.font="bold 14px Arial";ctx.fillText(String(values[i]),17,y+26);
    }
    if(rapidFire){
      ctx.fillStyle="#ffe65b";ctx.font="bold 17px Arial";ctx.textAlign="center";
      ctx.fillText("⚡ RAPID FIRE ⚡",canvas.width/2,102);
    }
    ctx.restore();
  };

  const damage=document.createElement("div");
  damage.id="battleDamage";document.body.appendChild(damage);
  let previousHealth=health;
  function watchHealth(){
    if(gameStarted&&health<previousHealth){
      damage.classList.remove("flash");void damage.offsetWidth;
      damage.classList.add("flash");
    }
    previousHealth=health;requestAnimationFrame(watchHealth);
  }
  requestAnimationFrame(watchHealth);
  const oldSpawnBoss=spawnBoss;
  spawnBoss=function(){
    const hadBoss=!!boss;oldSpawnBoss();
    if(hadBoss||!boss)return;
    const warning=document.createElement("div");
    warning.id="battleBossIntro";warning.textContent="⚠ BOSS INCOMING ⚠";
    document.body.appendChild(warning);
    setTimeout(()=>warning.remove(),2200);
  };
})();


/* Rolling ocean surf, wind-blown palms, and moving roadside grass. */
(() => {
  "use strict";
  if (typeof drawRoad !== "function" || typeof canvas === "undefined" || typeof ctx === "undefined") {
    console.warn("Battle Racers nature effects: load after the game scripts.");
    return;
  }

  const scene = new Image();
  scene.src = "battle-road.webp";
  const oldDrawRoad = drawRoad;
  const TAU = Math.PI * 2;
  const startedAt = performance.now();
  let seed = 7921;
  const random = () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };

  // Palm crowns flex in broad, forceful gusts, with smaller turbulent movements.
  const palms = [
    { x: 75, y: 135, size: .82, phase: .3 },
    { x: 92, y: 280, size: .72, phase: 1.7 },
    { x: 190, y: 430, size: .72, phase: 2.9 },
    { x: 133, y: 565, size: .60, phase: 4.2 },
    { x: 830, y: 585, size: .70, phase: 5.1 }
  ];

  // Grass blades are clustered on the image's green verges, clear of the asphalt.
  const grassPatches = [
    { x: 0, y: 610, w: 170, h: 190, n: 62, phase: .3 },
    { x: 0, y: 800, w: 115, h: 190, n: 54, phase: 1.4 },
    { x: 0, y: 1030, w: 100, h: 210, n: 48, phase: 2.8 },
    { x: 786, y: 690, w: 77, h: 140, n: 30, phase: 4.3 }
  ];
  for (const patch of grassPatches) {
    patch.blades = Array.from({ length: patch.n }, () => ({
      x: random() * patch.w,
      y: random() * patch.h,
      height: 10 + random() * 24,
      lean: (random() - .5) * .55,
      phase: random() * TAU,
      shade: random()
    }));
  }

  function drawPalm(g, palm, t) {
    const scale = palm.size;
    const gust = Math.sin(t * 1.05 + palm.phase) * 20 +
      Math.sin(t * 2.35 + palm.phase * 2) * 8;
    g.save();
    g.translate(palm.x, palm.y);
    // Fine curved fronds add visible motion while leaving the photo's trunks intact.
    for (let i = 0; i < 9; i++) {
      const angle = -Math.PI * .94 + i * Math.PI * .235;
      const flex = gust * (.48 + i / 13);
      const len = (38 + (i % 3) * 9) * scale;
      const ex = Math.cos(angle) * len + flex;
      const ey = Math.sin(angle) * len * .65 + Math.abs(flex) * .12;
      g.beginPath();
      g.moveTo(0, 0);
      g.quadraticCurveTo(ex * .48 + flex * .45, ey * .28, ex, ey);
      g.strokeStyle = i % 2 ? "rgba(20,78,31,.34)" : "rgba(218,240,145,.48)";
      g.lineWidth = 2.7 * scale;
      g.lineCap = "round";
      g.stroke();
      for (let j = 1; j <= 4; j++) {
        const p = j / 5;
        const bx = ex * p + flex * p;
        const by = ey * p;
        const side = (j % 2 ? -1 : 1) * (7 + j * 1.5) * scale;
        g.beginPath();
        g.moveTo(bx, by);
        g.quadraticCurveTo(bx + side * .38, by + 2 * scale, bx + side, by + 7 * scale);
        g.strokeStyle = "rgba(79,151,66,.34)";
        g.lineWidth = 1.5 * scale;
        g.stroke();
      }
    }
    g.restore();
  }

  function drawOcean(g, t, moving) {
    // The clip follows the open-water cove, keeping animated surf off the road.
    g.save();
    g.beginPath();
    g.moveTo(624, 296); g.lineTo(863, 270); g.lineTo(863, 555);
    g.lineTo(825, 550); g.lineTo(790, 527); g.lineTo(756, 496);
    g.lineTo(720, 457); g.lineTo(685, 415); g.lineTo(651, 365);
    g.closePath();
    g.clip();

    // Stronger, faster cross-waves make the water visibly rough in high wind.
    for (let row = 0; row < 11; row++) {
      const baseY = 302 + row * 23;
      const phase = t * moving * (1.75 + row * .075) + row * 1.31;
      const gust = .78 + .22 * Math.sin(t * moving * .72 + row * .48);
      g.beginPath();
      for (let x = 590; x <= 900; x += 8) {
        const y = baseY + Math.sin(x * .032 + phase) * (6 + row * .62) * gust +
          Math.sin(x * .014 - phase * .82) * 5.5 * gust +
          Math.sin(x * .058 + phase * .58 + row) * 1.8;
        if (x === 590) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.strokeStyle = row % 3 === 0 ? "rgba(225,252,251,.34)" : "rgba(14,74,91,.22)";

              g.lineWidth = row % 3 === 0 ? 2.8 : 1.8;
      g.stroke();
    }

    // Wind-driven foam crests travel quickly and break into uneven whitecaps.
    for (let row = 0; row < 8; row++) {
      const phase = t * moving * 1.22 + row * 1.12;
      const advance = (phase * 27) % 125;
      const baseY = 342 + row * 38 + advance * .30;
      g.beginPath();
      for (let x = 635; x <= 895; x += 5) {
        const y = baseY + Math.sin(x * .035 + phase) * 12 +
          Math.sin(x * .012 - phase * 1.4) * 7;
        if (x === 635) g.moveTo(x, y); else g.lineTo(x, y);
      }
      const strength = .22 + .18 * (.5 + .5 * Math.sin(phase * 1.7));
      g.strokeStyle = `rgba(240,255,250,${strength})`;
      g.lineWidth = 2.5 + row * .22;
      g.lineCap = "round";
      g.stroke();
      // A second broken highlight makes the crest read as moving foam, not a stripe.
      g.globalAlpha = .46;
      g.setLineDash([15, 17, 6, 23]);
      g.lineDashOffset = -phase * 42;
      g.lineWidth = 4;
      g.stroke();
      g.setLineDash([]);
      g.globalAlpha = 1;
    }

    // Brighter, quicker flecks catch light on the wind-tossed surface.
    for (let i = 0; i < 82; i++) {
      const phase = i * 2.399 + t * moving * (1.8 + (i % 5) * .18);
      const x = 635 + ((i * 47 + t * moving * (17 + i % 11) + 230) % 250);
      const y = 315 + ((i * 31 + Math.sin(phase) * 19 + t * moving * 9) % 235);
      g.globalAlpha = .13 + .19 * (.5 + .5 * Math.sin(phase * 1.6));
      g.strokeStyle = i % 3 === 0 ? "#ffffff" : "#a8eff2";
      g.lineWidth = 1.5 + (i % 3) * .55;
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(x + 12, y - 3, x + 25, y + 1);
      g.stroke();
    }
    g.restore();
  }

  function drawNature() {
    if (!scene.complete || !scene.naturalWidth) return;
    const w = canvas.width, h = canvas.height;
    const scale = Math.max(w / scene.naturalWidth, h / scene.naturalHeight);
    const offsetX = (w - scene.naturalWidth * scale) / 2;
    const offsetY = (h - scene.naturalHeight * scale) / 2;
    const t = (performance.now() - startedAt) / 1000;
    const moving = typeof paused !== "undefined" && paused ? .12 : 1;

    ctx.save();
    ctx.translate(offsetX, offsetY);
    ctx.scale(scale, scale);
    drawOcean(ctx, t, moving);

    for (const palm of palms) drawPalm(ctx, palm, t * moving);
    for (const patch of grassPatches) {
      const gust = Math.sin(t * 1.05 + patch.phase) * 23 * moving +
        Math.sin(t * 2.25 + patch.phase * 1.8) * 8 * moving;
      for (const blade of patch.blades) {
        const x = patch.x + blade.x;
        const y = patch.y + blade.y;
        const bend = gust + Math.sin(t * 2.8 + blade.phase) * 5 * moving;
        const tipX = x + blade.lean * blade.height + bend;
        const tipY = y - blade.height;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + bend * .28, y - blade.height * .58, tipX, tipY);
        ctx.strokeStyle = blade.shade > .5 ? "rgba(210,238,151,.36)" : "rgba(44,119,53,.36)";
        ctx.lineWidth = 1.2 + blade.shade * 1.2;
        ctx.lineCap = "round";
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  drawRoad = function () {
    oldDrawRoad();
    drawNature();
  };
})();


/* Lightweight steering lean, skid traces, and tire smoke for Battle Racers.
   Load after battle-racers-nature.js. */
(() => {
  "use strict";
  if (typeof drawCar !== "function" || typeof car === "undefined" ||
      typeof canvas === "undefined" || typeof ctx === "undefined") {
    console.warn("Battle Racers driving effects: load after the game scripts.");
    return;
  }

  const oldDrawCar = drawCar;
  const puffs = [];
  const skids = [];
  let lastX = car.x;
  let lastPuffAt = 0;
  let frame = 0;
  let lean = 0;

  function drawEffects(now, active, steering) {
    const cx = car.x + car.width / 2;
    const rearY = car.y + car.height * .86;
    const turn = Math.min(1, Math.abs(steering) / 7);

    if (active && turn > .32 && now - lastPuffAt > 95) {
      lastPuffAt = now;
      for (const side of [-1, 1]) {
        puffs.push({
          x: cx + side * car.width * .25,
          y: rearY,
          vx: -steering * .12 + side * .22,
          vy: 1.05 + Math.random() * .5,
          r: 3 + Math.random() * 3,
          life: 1,
          grow: .14 + Math.random() * .13
        });
      }
      if (Math.abs(steering) > 2.4) {
        for (const side of [-1, 1]) skids.push({
          x: cx + side * car.width * .25,
          y: rearY,
          side,
          life: 1
        });
      }
    }

    ctx.save();
    // Brief, faint tire traces appear only during a stronger turn.
    for (let i = skids.length - 1; i >= 0; i--) {
      const mark = skids[i];
      mark.life -= .018;
      if (mark.life <= 0) { skids.splice(i, 1); continue; }
      ctx.globalAlpha = .13 * mark.life;
      ctx.strokeStyle = "#172027";
      ctx.lineWidth = Math.max(1, car.width * .035);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(mark.x, mark.y);
      ctx.lineTo(mark.x - lean * car.width * .2, mark.y + 22 * mark.life);
      ctx.stroke();
    }
    // Soft gray puffs drift behind the rear tires and fade out.
    for (let i = puffs.length - 1; i >= 0; i--) {
      const puff = puffs[i];
      puff.x += puff.vx;
      puff.y += puff.vy;
      puff.r += puff.grow;
      puff.life -= .027;
      if (puff.life <= 0) { puffs.splice(i, 1); continue; }
      ctx.globalAlpha = .25 * puff.life;
      ctx.fillStyle = "#cbd5d7";
      ctx.beginPath();
      ctx.ellipse(puff.x, puff.y, puff.r * 1.2, puff.r, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  drawCar = function () {
    // Match the road-fix sprite's portrait placement before calculating the lean pivot.
    if (canvas.width < canvas.height && canvas.height > 600)
      car.y = canvas.height - 205;

    const now = performance.now();
    const playing = typeof gameStarted !== "undefined" && gameStarted &&
      !(typeof paused !== "undefined" && paused) &&
      !(typeof countdownActive !== "undefined" && countdownActive) &&
      !(typeof health !== "undefined" && health <= 0);
    const dx = car.x - lastX;
    lastX = car.x;
    const targetLean = playing ? Math.max(-.12, Math.min(.12, dx * .022)) : 0;
    lean += (targetLean - lean) * .24;

    if (playing && ++frame % 3 === 0)
      drawEffects(now, true, dx);
    else if (!playing && (puffs.length || skids.length))
      drawEffects(now, false, 0);

    const pivotX = car.x + car.width / 2;
    const pivotY = car.y + car.height * .37;
    ctx.save();
    ctx.translate(pivotX, pivotY);
    ctx.rotate(lean);
    ctx.translate(-pivotX, -pivotY);
    oldDrawCar();
    ctx.restore();
  };
})();


/* Enhanced weapon impacts and explosions for Battle Racers.
   Load after battle-racers-driving.js. */
(() => {
  "use strict";
  if (typeof drawEnemies !== "function" || typeof drawBoss !== "function" ||
      typeof canvas === "undefined" || typeof ctx === "undefined") {
    console.warn("Battle Racers combat effects: load after the game scripts.");
    return;
  }

  const oldDrawEnemies = drawEnemies;
  const oldDrawBoss = drawBoss;
  const effects = [];
  const enemyStates = new Map();
  let bossState = null;
  let lastEffectsPaint = -Infinity;

  function addBurst(x, y, heavy) {
    const sparks = [];
    const count = heavy ? 26 : 12;
    for (let i = 0; i < count; i++) {
      const a = Math.PI * 2 * i / count + (Math.random() - .5) * .3;
      const speed = (heavy ? 45 : 32) + Math.random() * (heavy ? 115 : 75);
      sparks.push({
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed,
        length: 4 + Math.random() * (heavy ? 17 : 10),
        hue: Math.random() < .28 ? 48 : (heavy ? 20 : 188)
      });
    }
    effects.push({ x, y, start: performance.now(), heavy, sparks,
      life: heavy ? 720 : 330 });
    if (effects.length > 24) effects.splice(0, effects.length - 24);
  }

  function paintEffects(now) {
    // drawEnemies and drawBoss may both run in one frame; paint the overlay once.
    if (now - lastEffectsPaint < 6) return;
    lastEffectsPaint = now;
    ctx.save();
    for (let n = effects.length - 1; n >= 0; n--) {
      const fx = effects[n];
      const elapsed = now - fx.start;
      const p = Math.max(0, Math.min(1, elapsed / fx.life));
      const fade = 1 - p;
      if (fade <= 0) { effects.splice(n, 1); continue; }
      const radius = (fx.heavy ? 10 : 5) + p * (fx.heavy ? 45 : 24);

      // Bright center flash fades quickly, followed by an expanding hot ring.
      const glow = ctx.createRadialGradient(fx.x, fx.y, 0, fx.x, fx.y, radius * 1.2);
      glow.addColorStop(0, `rgba(255,255,245,${.86 * fade})`);
      glow.addColorStop(.22, fx.heavy
        ? `rgba(255,190,54,${.78 * fade})`
        : `rgba(95,231,255,${.7 * fade})`);
      glow.addColorStop(1, "rgba(255,80,20,0)");
      ctx.globalAlpha = fade;
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, radius * 1.2, 0, Math.PI * 2); ctx.fill();

      ctx.globalAlpha = .72 * fade;
      ctx.strokeStyle = fx.heavy ? "#ffb53d" : "#bdfaff";
      ctx.lineWidth = Math.max(1, (fx.heavy ? 4 : 2.5) * fade);
      ctx.beginPath(); ctx.arc(fx.x, fx.y, radius, 0, Math.PI * 2); ctx.stroke();

      // Warm sparks fan outward and drop under gravity.
      for (const s of fx.sparks) {
        const x1 = fx.x + s.vx * elapsed / 1000;
        const y1 = fx.y + s.vy * elapsed / 1000 + 50 * (elapsed / 1000) ** 2;
        const tail = Math.max(.12, 1 - p * 1.4);
        ctx.globalAlpha = fade * tail;
        ctx.strokeStyle = s.hue === 188 ? "#a7f8ff" : `hsl(${s.hue} 100% 62%)`;
        ctx.lineWidth = fx.heavy ? 2 : 1.5;
        ctx.beginPath();
        ctx.moveTo(x1 - s.vx * .035, y1 - s.vy * .035);
        ctx.lineTo(x1, y1);
        ctx.stroke();
      }

      if (fx.heavy) {
        // A soft smoke halo lingers after the bright blast.
        ctx.globalAlpha = .16 * fade;
        ctx.fillStyle = "#65727a";
        ctx.beginPath();
        ctx.ellipse(fx.x, fx.y + p * 5, 13 + p * 24, 10 + p * 18, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function snapshotEnemies() {
    if (typeof enemies === "undefined" || !Array.isArray(enemies)) return;
    const live = new Set(enemies);
    for (const e of enemies) {
      const hp = Number(e.health ?? e.hp);
      const old = enemyStates.get(e);
      const x = Number(e.x) + Number(e.width || 0) / 2;

      const y = Number(e.y) + Number(e.height || 0) / 2;
      if (old && Number.isFinite(hp) && Number.isFinite(old.hp) && hp < old.hp)
        addBurst(x, y, false);
      enemyStates.set(e, { hp, x, y });
    }
    for (const [e, old] of enemyStates) {
      if (live.has(e)) continue;
      if (old.y > canvas.height * .3 && old.y < canvas.height * .9)
        addBurst(old.x, old.y, true);
      enemyStates.delete(e);
    }
  }

  drawEnemies = function () {
    oldDrawEnemies();
    snapshotEnemies();
    paintEffects(performance.now());
  };

  drawBoss = function () {
    oldDrawBoss();
    if (typeof boss !== "undefined" && boss) {
      const hp = Number(boss.health);
      const x = Number(boss.x) + Number(boss.width || 0) / 2;
      const y = Number(boss.y) + Number(boss.height || 0) / 2;
      if (bossState && bossState.object === boss && Number.isFinite(hp) && hp < bossState.hp)
        addBurst(x, y, false);
      bossState = { object: boss, hp };
    } else if (bossState) {
      if (bossState.y > 0 && bossState.y < canvas.height * .9)
        addBurst(bossState.x, bossState.y, true);
      bossState = null;
    }
    if (bossState && typeof boss !== "undefined" && boss) {
      bossState.x = Number(boss.x) + Number(boss.width || 0) / 2;
      bossState.y = Number(boss.y) + Number(boss.height || 0) / 2;
    }
    paintEffects(performance.now());
  };
})();

  </script>
<script>
/* Paddle controls, forward traffic and rival turret attacks. */
(()=>{
  "use strict";
  const style=document.createElement("style");
  style.textContent=`
    #steeringWheel{display:none!important}
    #paddleControls{position:fixed;left:14px;bottom:max(70px,calc(20px + env(safe-area-inset-bottom)));z-index:135;display:flex;gap:9px}
    .drivePaddle{width:76px;height:66px;border:2px solid #eafaff;border-radius:15px;color:#fff;font:bold 13px Arial;box-shadow:0 3px 12px #0009;touch-action:none;user-select:none;-webkit-user-select:none}
    .drivePaddle span{display:block;font-size:24px;line-height:26px}
    #gasPaddle{background:linear-gradient(#279448,#0b5429);border-color:#a4ffb5}
    #brakePaddle{background:linear-gradient(#a9502a,#542414);border-color:#ffd7a5}
    @media(orientation:landscape) and (max-height:600px){#paddleControls{left:10px;bottom:7px}.drivePaddle{width:68px;height:53px;font-size:11px}.drivePaddle span{font-size:20px;line-height:20px}}
    @media(orientation:portrait) and (max-width:900px){#paddleControls{left:9px;bottom:max(72px,calc(22px + env(safe-area-inset-bottom)));gap:5px}.drivePaddle{width:64px;height:58px;font-size:11px}}
  `;
  document.head.appendChild(style);

  const controls=document.createElement("div");
  controls.id="paddleControls";
  controls.innerHTML='<button id="brakePaddle" class="drivePaddle"><span>−</span>SLOW</button><button id="gasPaddle" class="drivePaddle"><span>+</span>GAS</button>';
  document.body.appendChild(controls);

  let driveSpeed=1;
  const speedText=document.createElement("div");
  speedText.id="driveSpeedReadout";
  speedText.style.cssText="position:fixed;left:12px;top:174px;z-index:140;padding:5px 9px;border:1px solid #7bd9ff;border-radius:9px;background:#061725d9;color:white;font:bold 13px Arial;pointer-events:none";
  document.body.appendChild(speedText);

  function setDriveSpeed(delta){
    driveSpeed=Math.max(.65,Math.min(1.65,driveSpeed+delta));
    speedText.textContent="🏎 SPEED "+Math.round(driveSpeed*100)+"%";
  }
  setDriveSpeed(0);
  function holdPaddle(button,delta){
    let timer=null;
    button.addEventListener("pointerdown",e=>{
      e.preventDefault();
      try{button.setPointerCapture(e.pointerId)}catch{}
      setDriveSpeed(delta);
      timer=setInterval(()=>setDriveSpeed(delta),120);
    });
    const stop=()=>{if(timer){clearInterval(timer);timer=null}};
    button.addEventListener("pointerup",stop);
    button.addEventListener("pointercancel",stop);
    button.addEventListener("lostpointercapture",stop);
  }
  holdPaddle(document.getElementById("gasPaddle"),.06);
  holdPaddle(document.getElementById("brakePaddle"),-.06);

  // Keep the existing lane steering behavior available through a screen swipe.
  let steeringPointer=null;
  canvas.addEventListener("pointerdown",e=>{
    if(e.target!==canvas||health<=0)return;
    steeringPointer={id:e.pointerId,x:e.clientX};
    try{canvas.setPointerCapture(e.pointerId)}catch{}
  });
  canvas.addEventListener("pointermove",e=>{
    if(!steeringPointer||steeringPointer.id!==e.pointerId)return;
    const dx=e.clientX-steeringPointer.x;
    car.x=Math.max(0,Math.min(canvas.width-car.width,car.x+dx));
    steeringPointer.x=e.clientX;
  });
  function endSteering(e){if(steeringPointer&&(!e||e.pointerId===steeringPointer.id))steeringPointer=null}
  canvas.addEventListener("pointerup",endSteering);
  canvas.addEventListener("pointercancel",endSteering);

  // Lower relative approach speed so rival traffic stays ahead longer.
  const originalSpawnEnemy=spawnEnemy;
  spawnEnemy=function(){
    const before=enemies.length;
    originalSpawnEnemy();
    if(enemies.length>before){
      const enemy=enemies[enemies.length-1];
      enemy.speed=.9+Math.min(score/5000,.35);
      enemy.nextRivalShot=performance.now()+10000;
    }
  };

  function fireRivalShot(enemy){
    if(!enemy||health<=0)return;
    const sx=enemy.x+enemy.width/2;
    const sy=enemy.y+enemy.height*.62;
    const tx=car.x+car.width/2;
    const ty=car.y+car.height/2;
    const dx=tx-sx,dy=ty-sy,len=Math.hypot(dx,dy)||1,speed=3;
    enemyBullets.push({x:sx-5,y:sy,width:10,height:15,vx:dx/len*speed,vy:dy/len*speed,damage:1,bossShot:false,rivalShot:true});
  }

  const originalDrawEnemies=drawEnemies;
  drawEnemies=function(){
    for(const enemy of enemies){
      if(enemy.nextRivalShot===undefined)enemy.nextRivalShot=performance.now()+10000;
    }
    originalDrawEnemies();
    const now=performance.now();
    for(const enemy of enemies){
      enemy.speed=.9+Math.min(score/5000,.35);
      // Player gas changes relative approach: speeding up keeps rival traffic farther ahead.
      enemy.y+=enemy.speed*(1-driveSpeed);
      if(now>=enemy.nextRivalShot){
        fireRivalShot(enemy);
        enemy.nextRivalShot=now+10000;
      }
      // A clearly visible roof gun with its barrel pointing back toward the player.
      const depth=Math.max(0,Math.min(1,enemy.y/canvas.height));
      const scale=.43+.75*depth;
      const carW=(enemy.strong?70:58)*scale;
      const carH=(enemy.strong?83:72)*scale;
      const left=enemy.x+enemy.width/2-carW/2;
      const top=enemy.y;
      const cx=left+carW/2,cy=top+carH*.39;
      ctx.save();
      ctx.fillStyle="#121820";
      ctx.strokeStyle="#ffe08a";
      ctx.lineWidth=Math.max(1.5,scale*2);
      ctx.beginPath();
      ctx.roundRect(cx-carW*.17,cy-carH*.035,carW*.34,carH*.17,4*scale);
      ctx.fill();ctx.stroke();
      ctx.fillStyle="#dce4e8";
      ctx.fillRect(cx-carW*.045,cy+carH*.07,carW*.09,carH*.22);
      ctx.fillStyle="#ff7a22";
      ctx.shadowBlur=10;ctx.shadowColor="#ff481c";
      ctx.beginPath();ctx.arc(cx,cy+carH*.31,Math.max(2,3*scale),0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  };

  // Gas and brake change the visual road pace and relative traffic movement.
  const originalDrawRoad=drawRoad;
  drawRoad=function(){
    originalDrawRoad();
    if(gameStarted&&!paused&&!countdownActive&&health>0){
      sceneryOffset=((sceneryOffset+(driveSpeed-1)*7)%500+500)%500;
    }
  };
  const originalDrawHud=drawHUD;
  drawHUD=function(){
    originalDrawHud();
    speedText.textContent="🏎 SPEED "+Math.round(driveSpeed*100)+"%";
  };
})();

<script>
const oldPlayButton = document.getElementById("playButton");
const workingPlayButton = oldPlayButton.cloneNode(true);
oldPlayButton.replaceWith(workingPlayButton);

workingPlayButton.addEventListener("click", () => {
  resetGame();
  gameStarted = true;
  countdownActive = true;
  startMenu.style.display = "none";
  countdownOverlay.style.display = "flex";

  let count = 3;
  countdownText.textContent = count;

  const timer = setInterval(() => {
    count--;

    if (count > 0) {
      countdownText.textContent = count;
    } else if (count === 0) {
      countdownText.textContent = "GO!";
    } else {
      clearInterval(timer);
      countdownOverlay.style.display = "none";
      countdownActive = false;
    }
  }, 850);
});
</script>
