<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Racers</title>
<style>
body { margin:0; overflow:hidden; background:#111; font-family:Arial; }
canvas { display:block; margin:auto; background:#333; }
#title { position:fixed; top:10px; width:100%; text-align:center; color:white; font-size:24px; font-weight:bold; z-index:100; }
#fireButton { touch-action:none; user-select:none; -webkit-user-select:none; position:fixed; bottom:30px; right:25px; z-index:100; background:red; color:white; border:3px solid white; border-radius:50%; width:80px; height:80px; font-size:18px; font-weight:bold; }
#upgradeButton,#garageButton,#weaponButton { display:none; }
#shopBar {
  position:fixed; left:50%; transform:translateX(-50%); bottom:12px;
  z-index:120; display:flex; gap:10px;
}
.shopTab {
  min-width:105px; height:48px; border:2px solid white; border-radius:14px;
  background:#202020; color:white; font-weight:bold; font-size:15px;
}
#shopPage {
  display:none; position:fixed; inset:0; z-index:500; background:#111;
  color:white; overflow:auto; padding:18px; box-sizing:border-box;
}
#shopHeader { display:flex; align-items:center; justify-content:space-between; gap:12px; }
#shopTitle { font-size:28px; font-weight:bold; }
#shopCoins { font-size:20px; font-weight:bold; }
#backButton {
  min-width:90px; height:46px; border:2px solid white; border-radius:12px;
  background:#333; color:white; font-size:16px; font-weight:bold;
}
#shopGrid {
  display:grid; grid-template-columns:repeat(3,minmax(150px,1fr));
  gap:14px; margin-top:18px; padding-bottom:25px;
}
.shopCard {
  background:#242424; border:2px solid #555; border-radius:16px;
  padding:14px; text-align:center;
}
.shopPreview { font-size:52px; min-height:64px; }
.shopName { font-size:18px; font-weight:bold; margin:6px 0; }
.shopStat { font-size:13px; color:#ddd; min-height:36px; }
.shopAction {
  width:100%; min-height:44px; margin-top:10px; border:0; border-radius:10px;
  font-weight:bold; font-size:14px;
}
@media (max-width:700px) and (orientation:landscape) {
  #shopGrid { grid-template-columns:repeat(3,minmax(120px,1fr)); }
  .shopCard { padding:10px; }
  .shopPreview { font-size:42px; min-height:50px; }
  #shopBar { gap:6px; }
  .shopTab { min-width:88px; font-size:13px; }
}
#upgradeButton { bottom:125px; background:gold; color:black; font-size:16px; }
#garageButton { bottom:190px; background:blue; font-size:16px; }
#weaponButton { bottom:255px; background:purple; font-size:15px; }

#rotateMessage {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #111;
  color: white;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
  box-sizing: border-box;
  font-size: 28px;
  font-weight: bold;
}
#steeringWheel {
  position: fixed;
  left: 25px;
  bottom: 30px;
  z-index: 110;
  width: 125px;
  height: 125px;
  border-radius: 50%;
  border: 7px solid white;
  background: #222;
  color: white;
  font-size: 58px;
  line-height: 1;
  touch-action: none;
  user-select: none;
}
@media (orientation: portrait) and (max-width: 900px) {
  #rotateMessage { display: flex; }
  #game, #title, #fireButton, #upgradeButton, #garageButton, #weaponButton, #steeringWheel, #shopBar, #shopPage {
    visibility: hidden;
  }
}
@media (orientation: landscape) {
  #rotateMessage { display: none; }
}


#pauseButton{
 position:fixed;top:8px;right:10px;z-index:140;
 width:46px;height:40px;border-radius:12px;
 border:2px solid rgba(75,190,255,.9);
 background:rgba(4,12,20,.78);color:white;
 font-size:20px;font-weight:bold;
}
</style>
</head>
<body>
<div id="title">🏁 BATTLE RACERS 🏁</div>
<canvas id="game"></canvas>
<button id="fireButton">🔥 FIRE</button>
<button id="upgradeButton">⬆️ UPGRADE</button>
<button id="garageButton">🚗 GARAGE</button>
<button id="weaponButton">🔫 WEAPON</button>
<button id="steeringWheel" aria-label="Steering wheel">◀ ◎ ▶</button>
<div id="rotateMessage">📱↻<br><br>ROTATE YOUR PHONE<br>TO PLAY BATTLE RACERS</div>
<div id="shopBar">
  <button class="shopTab" id="carsShopButton">🚗 CARS</button>
  <button class="shopTab" id="weaponsShopButton">🔫 WEAPONS</button>
  <button class="shopTab" id="tiresShopButton">🛞 TIRES</button>
</div>
<div id="shopPage">
  <div id="shopHeader">
    <button id="backButton">⬅ BACK</button>
    <div id="shopTitle">SHOP</div>
    <div id="shopCoins">COINS: 0</div>
  </div>
  <div id="shopGrid"></div>
</div>
<button id="pauseButton" aria-label="Pause game">⏸</button>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
canvas.width=innerWidth; canvas.height=innerHeight;
const car={x:canvas.width/2-25,y:canvas.height-150,width:50,height:90,speed:8};
const bullets=[],enemies=[],explosions=[],powerUps=[];
let score=0,health=3,level=1,gameStarted=false,rapidFire=false,rapidFireTimer=0;
let bestScore=Number(localStorage.getItem("bestScore"))||0;
let paused=false;
let coins=Number(localStorage.getItem("coins"))||0;
let carUpgradeLevel=Number(localStorage.getItem("carUpgradeLevel"))||1;
let weaponLevel=Number(localStorage.getItem("weaponLevel"))||1;
let carColor=localStorage.getItem("selectedCar")||"red";
let unlockedCars=JSON.parse(localStorage.getItem("unlockedCars"))||["red"];

let selectedWeapon=localStorage.getItem("selectedWeapon")||"starter";
let unlockedWeapons=JSON.parse(localStorage.getItem("unlockedWeapons"))||["starter"];
let selectedTire=localStorage.getItem("selectedTire")||"street";
let unlockedTires=JSON.parse(localStorage.getItem("unlockedTires"))||["street"];

const shopCars=[
 {id:"red",name:"Red Racer",cost:0,icon:"🏎️",stat:"Classic balanced racer"},
 {id:"blue",name:"Blue Speedster",cost:100,icon:"🚙",stat:"Fast street racer"},
 {id:"green",name:"Green Monster",cost:250,icon:"🚗",stat:"Heavy monster style"},
 {id:"orange",name:"Orange Blazer",cost:500,icon:"🏎️",stat:"Sport racing body"},
 {id:"purple",name:"Purple Phantom",cost:1000,icon:"🚘",stat:"Elite phantom racer"},
 {id:"gold",name:"Gold Champion",cost:2500,icon:"🏆",stat:"Champion collector car"}
];
const shopWeapons=[
 {id:"starter",name:"Starter Blaster",cost:0,icon:"🔫",damageBonus:0,fireRate:180,stat:"Standard weapon"},
 {id:"twin",name:"Twin Blaster",cost:150,icon:"🔫🔫",damageBonus:1,fireRate:165,stat:"+1 damage • faster fire"},
 {id:"machine",name:"Machine Gun",cost:400,icon:"⚙️",damageBonus:2,fireRate:135,stat:"+2 damage • rapid fire"},
 {id:"plasma",name:"Plasma Cannon",cost:800,icon:"🟣",damageBonus:3,fireRate:120,stat:"+3 damage • fast fire"},
 {id:"laser",name:"Laser Cannon",cost:1500,icon:"⚡",damageBonus:5,fireRate:105,stat:"+5 damage • very fast"},
 {id:"champion",name:"Champion Cannon",cost:3000,icon:"💥",damageBonus:8,fireRate:90,stat:"+8 damage • max fire rate"}
];
const shopTires=[
 {id:"street",name:"Street Tires",cost:0,icon:"🛞",handling:0,stat:"Standard handling"},
 {id:"sport",name:"Sport Tires",cost:125,icon:"🛞",handling:.4,stat:"+ handling"},
 {id:"grip",name:"Grip Tires",cost:300,icon:"🛞",handling:.8,stat:"Better steering"},
 {id:"racing",name:"Racing Slicks",cost:650,icon:"🛞",handling:1.2,stat:"Fast response"},
 {id:"pro",name:"Pro Tires",cost:1200,icon:"🛞",handling:1.7,stat:"Pro handling"},
 {id:"champion",name:"Champion Tires",cost:2400,icon:"🏁",handling:2.3,stat:"Maximum handling"}
];
let bulletSpeed=10+(weaponLevel-1)*2,bulletDamage=weaponLevel;
car.speed=8+(carUpgradeLevel-1);


// ENEMY + BOSS SHOOTING
let enemyBullets=[];
let enemyShotTimer=0;

function fireEnemyShot(shooter, bossShot=false){
  if(!shooter || health<=0) return;
  const sx=shooter.x+shooter.width/2;
  const sy=shooter.y+shooter.height;
  const tx=car.x+car.width/2;
  const ty=car.y+car.height/2;
  const dx=tx-sx, dy=ty-sy, len=Math.hypot(dx,dy)||1;
  const speed=bossShot?5.2:2.2;
  enemyBullets.push({
    x:sx-4,y:sy,width:8,height:14,
    vx:(dx/len)*speed,vy:(dy/len)*speed,
    damage:bossShot?2:1,bossShot
  });
}

function updateEnemyShooting(){
  if(!gameStarted || health<=0 || shopPage.style.display==="block") return;

  // Only the BOSS can fire bullets. Regular and monster enemy cars cannot fire.
  if(boss){
    enemyShotTimer++;
    if(enemyShotTimer>=300){ // about every 5 seconds
      enemyShotTimer=0;
      fireEnemyShot(boss,true);
    }
  }else{
    enemyShotTimer=0;
  }
  return; // Keep the old enemy-car firing code below disabled.

  // Monster cars fire one opening shot when they first appear on screen.
  for(const e of enemies){
    if(e.strong && !e.openingShotFired && e.y>=5){
      e.openingShotFired=true;
      fireEnemyShot(e,false);
    }
  }

  enemyShotTimer++;
  if(enemyShotTimer<300) return;
  enemyShotTimer=0;

  if(boss){
    fireEnemyShot(boss,true);
    return;
  }

  const shooters=enemies.filter(e=>e.strong && e.y>20 && e.y<car.y-80);
  if(shooters.length){
    fireEnemyShot(shooters[Math.floor(Math.random()*shooters.length)],false);
  }
}

function drawEnemyBullets(){
  for(let i=enemyBullets.length-1;i>=0;i--){
    const b=enemyBullets[i];
    b.x+=b.vx;b.y+=b.vy;

    ctx.save();
    ctx.shadowBlur=b.bossShot?18:11;
    ctx.shadowColor=b.bossShot?"#ff2b00":"#ff9d00";
    ctx.fillStyle=b.bossShot?"#ff3b16":"#ffb31a";
    if(b.missile){
      ctx.fillStyle="#d8dde3";
      ctx.fillRect(b.x+3,b.y,6,17);
      ctx.fillStyle="#ff3b16";
      ctx.beginPath();ctx.moveTo(b.x+3,b.y);ctx.lineTo(b.x+9,b.y);ctx.lineTo(b.x+6,b.y-7);ctx.closePath();ctx.fill();
      ctx.fillStyle="#ffb000";
      ctx.beginPath();ctx.moveTo(b.x+3,b.y+17);ctx.lineTo(b.x+9,b.y+17);ctx.lineTo(b.x+6,b.y+27);ctx.closePath();ctx.fill();
    }else{
      ctx.beginPath();
      ctx.arc(b.x+b.width/2,b.y+b.height/2,b.bossShot?6:4,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();

    if(b.x<car.x+car.width && b.x+b.width>car.x &&
       b.y<car.y+car.height && b.y+b.height>car.y){
      health-=b.damage;if(health<0)health=0;
      addBlastEffect(b.x+b.width/2,b.y+b.height/2,false);
      enemyBullets.splice(i,1);
      continue;
    }

    if(b.y>canvas.height+30 || b.y<-30 || b.x<-30 || b.x>canvas.width+30){
      enemyBullets.splice(i,1);
    }
  }
}


// BOSS LAND MINES — every 10 seconds while the boss is alive
let bossMines=[];
let bossMineTimer=0;
let bossWasActive=false;
let bossAttackWarning=0;


function fireBossMissile(offsetX){
  if(!boss || health<=0) return;
  const sx=boss.x+boss.width/2+offsetX;
  const sy=boss.y+boss.height;
  const tx=car.x+car.width/2;
  const ty=car.y+car.height/2;
  const dx=tx-sx,dy=ty-sy,len=Math.hypot(dx,dy)||1;
  const speed=3.4;
  enemyBullets.push({
    x:sx-6,y:sy,width:12,height:24,
    vx:(dx/len)*speed,vy:(dy/len)*speed,
    damage:1,bossShot:true,missile:true
  });
}

function updateBossMines(){
  if(!gameStarted || health<=0) return;

  if(!boss){
    bossMineTimer=0;
    bossWasActive=false;
    return;
  }

  // Start the 10-second countdown when the boss first appears.
  if(!bossWasActive){
    bossWasActive=true;
    bossMineTimer=0;
  }

  bossMineTimer++;

  // Warn the player about 2 seconds before missiles and mines arrive.
  if(bossMineTimer===480) bossAttackWarning=120;

  if(bossMineTimer>=600){ // about 10 seconds at 60 FPS
    bossMineTimer=0;

    // Every 10 seconds launch 3 missiles from different boss positions,
    // with a short delay between each missile.
    [-boss.width*.28, 0, boss.width*.28].forEach((offset,index)=>{
      setTimeout(()=>{
        if(boss && gameStarted && health>0) fireBossMissile(offset);
      },index*450);
    });

    // Drop 5 land mines one-by-one in different random places.
    for(let i=0;i<5;i++){
      setTimeout(()=>{
        if(!boss || !gameStarted || health<=0) return;
        const margin=35;
        const x=margin+Math.random()*Math.max(1,canvas.width-margin*2);
        bossMines.push({
          x:x-11,
          y:boss.y+boss.height+8,
          width:22,
          height:22,
          speed:2.0,
          life:900
        });
      },i*650);
    }
  }
}


function drawBossAttackWarning(){
  if(bossAttackWarning<=0 || !boss) return;
  bossAttackWarning--;

  ctx.save();
  const pulse=0.65+Math.abs(Math.sin(bossAttackWarning*.18))*.35;
  ctx.globalAlpha=pulse;
  ctx.textAlign="center";
  ctx.font="bold 22px Arial";
  ctx.fillStyle="#ffef4a";
  ctx.strokeStyle="rgba(0,0,0,.9)";
  ctx.lineWidth=5;
  const msg="⚠ MISSILES + MINES INCOMING! ⚠";
  ctx.strokeText(msg,canvas.width/2,95);
  ctx.fillText(msg,canvas.width/2,95);
  ctx.restore();
}

function drawBossMines(){
  for(let i=bossMines.length-1;i>=0;i--){
    const m=bossMines[i];
    m.y+=m.speed;
    m.life--;

    // Mine shadow
    ctx.save();
    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.beginPath();ctx.ellipse(m.x+11,m.y+17,15,7,0,0,Math.PI*2);ctx.fill();

    // Mine body
    ctx.fillStyle="#242424";
    ctx.beginPath();ctx.arc(m.x+11,m.y+11,10,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#9aa0a6";ctx.lineWidth=2;ctx.stroke();

    // Warning light
    ctx.shadowBlur=10;ctx.shadowColor="#ff2b00";
    ctx.fillStyle="#ff3b18";
    ctx.beginPath();ctx.arc(m.x+11,m.y+8,3,0,Math.PI*2);ctx.fill();
    ctx.restore();

    // Player hits a mine
    if(m.x<car.x+car.width && m.x+m.width>car.x &&
       m.y<car.y+car.height && m.y+m.height>car.y){
      health-=1;if(health<0)health=0;
      addBlastEffect(m.x+11,m.y+11,true);
      bossMines.splice(i,1);
      continue;
    }

    if(m.y>canvas.height+30 || m.life<=0) bossMines.splice(i,1);
  }
}

// BOSS SYSTEM
let boss=null,lastBossLevel=0,bossWarningTimer=0;

function spawnBoss(){
  if(boss || level<5 || level%5!==0 || lastBossLevel===level) return;
  lastBossLevel=level;
  enemies.length=0;
  const stage=level/5;
  const maxHealth=40+(stage-1)*25;
  boss={
    x:canvas.width/2-55,y:-160,width:110,height:145,
    speed:1.2+Math.min(stage*.15,1.8),
    health:maxHealth,maxHealth:maxHealth,
    damage:3,reward:50*stage,scoreReward:100,
    direction:1
  };
  bossWarningTimer=120;
}

function spawnEnemy(){
  if(!gameStarted||health<=0||boss) return;
  const isStrong=Math.random()<.3;
  enemies.push({,x:4+Math.random()*Math.max(1,canvas.width-58)y:-100,width:50,height:90,
    speed:3+Math.min(score/100,5),health:isStrong?3:1,strong:isStrong});
}
function spawnPowerUp(){
  if(!gameStarted||health<=0)return;
  const type=Math.random()<.5?"rapid":"health";
  powerUps.push({x:Math.random()*(canvas.width-30),y:-30,width:30,height:30,speed:3,type});
}
setInterval(spawnEnemy,1500); setInterval(spawnPowerUp,8000);

let sceneryOffset=0;
function drawRoad(){
 const w=canvas.width,h=canvas.height;
 const horizon=h*.22;

 // Sky
 const sky=ctx.createLinearGradient(0,0,0,horizon+80);
 sky.addColorStop(0,"#4aaee5");sky.addColorStop(.72,"#bcecff");sky.addColorStop(1,"#f5fbff");
 ctx.fillStyle=sky;ctx.fillRect(0,0,w,horizon+80);

 // Sun
 ctx.fillStyle="rgba(255,244,190,.9)";
 ctx.beginPath();ctx.arc(w*.78,h*.09,25,0,Math.PI*2);ctx.fill();

 // Mountains
 ctx.fillStyle="#597b72";ctx.beginPath();ctx.moveTo(0,horizon);
 for(let x=0;x<=w;x+=55){
   const peak=horizon-(22+Math.abs(Math.sin(x*.021))*65);
   ctx.lineTo(x,peak);
 }
 ctx.lineTo(w,horizon);ctx.closePath();ctx.fill();
 ctx.fillStyle="#365b50";ctx.beginPath();ctx.moveTo(0,horizon+18);
 for(let x=0;x<=w;x+=70)ctx.lineTo(x,horizon-15-Math.abs(Math.cos(x*.017))*35);
 ctx.lineTo(w,horizon+18);ctx.closePath();ctx.fill();

 // Ocean
 ctx.fillStyle="#138db1";ctx.fillRect(0,horizon,w,h-horizon);
 ctx.strokeStyle="rgba(255,255,255,.22)";ctx.lineWidth=2;
 for(let y=horizon+20;y<h;y+=34){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}

 // Perspective road
 const topL=w*.38,topR=w*.62,botL=w*.08,botR=w*.92;
 const asphalt=ctx.createLinearGradient(0,horizon,0,h);
 asphalt.addColorStop(0,"#555b60");asphalt.addColorStop(1,"#24282c");
 ctx.fillStyle=asphalt;ctx.beginPath();
 ctx.moveTo(topL,horizon);ctx.lineTo(topR,horizon);ctx.lineTo(botR,h);ctx.lineTo(botL,h);ctx.closePath();ctx.fill();

 // Shoulders
 ctx.strokeStyle="#e8e8e8";ctx.lineWidth=12;
 ctx.beginPath();ctx.moveTo(topL,horizon);ctx.lineTo(botL,h);ctx.moveTo(topR,horizon);ctx.lineTo(botR,h);ctx.stroke();
 ctx.strokeStyle="#e53935";ctx.lineWidth=6;ctx.setLineDash([30,25]);ctx.lineDashOffset=-sceneryOffset;
 ctx.beginPath();ctx.moveTo(topL,horizon);ctx.lineTo(botL,h);ctx.moveTo(topR,horizon);ctx.lineTo(botR,h);ctx.stroke();

 // Lane lines
 ctx.strokeStyle="rgba(255,255,255,.92)";ctx.lineWidth=5;ctx.setLineDash([40,46]);ctx.lineDashOffset=-sceneryOffset;
 for(const f of [1/3,2/3]){
   ctx.beginPath();ctx.moveTo(topL+(topR-topL)*f,horizon);ctx.lineTo(botL+(botR-botL)*f,h);ctx.stroke();
 }
 ctx.setLineDash([]);

 // Guardrails
 ctx.strokeStyle="#bfc7cc";ctx.lineWidth=5;
 ctx.beginPath();ctx.moveTo(topL-18,horizon);ctx.lineTo(botL-22,h);ctx.moveTo(topR+18,horizon);ctx.lineTo(botR+22,h);ctx.stroke();

 // Palm trees
 ctx.strokeStyle="#173d22";ctx.fillStyle="#173d22";
 for(let x=45;x<w;x+=150){
   if(x>w*.28&&x<w*.72)continue;
   const py=horizon+48+(x%4)*8;
   ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,py);ctx.lineTo(x+2,py-48);ctx.stroke();
   for(let a=0;a<6;a++){
     const ang=(Math.PI*2/6)*a;
     ctx.beginPath();ctx.moveTo(x+2,py-48);ctx.lineTo(x+2+Math.cos(ang)*24,py-48+Math.sin(ang)*13);ctx.stroke();
   }
 }
 sceneryOffset=(sceneryOffset+7)%500;
}

function drawCar(){
 const x=car.x,y=car.y,w=car.width,h=car.height;
 ctx.save();
 ctx.fillStyle="rgba(0,0,0,.45)";ctx.beginPath();ctx.ellipse(x+w/2,y+h*.68,w*.68,h*.38,0,0,Math.PI*2);ctx.fill();

 ctx.fillStyle="#070707";
 ctx.fillRect(x-6,y+h*.18,9,h*.28);ctx.fillRect(x+w-3,y+h*.18,9,h*.28);
 ctx.fillRect(x-6,y+h*.62,9,h*.26);ctx.fillRect(x+w-3,y+h*.62,9,h*.26);

 const body=ctx.createLinearGradient(x,y,x+w,y+h);
 body.addColorStop(0,"#f4f4f4");body.addColorStop(.13,carColor);body.addColorStop(.72,carColor);body.addColorStop(1,"#090909");
 ctx.fillStyle=body;ctx.beginPath();
 ctx.moveTo(x+w*.22,y);ctx.lineTo(x+w*.78,y);
 ctx.quadraticCurveTo(x+w,y+h*.14,x+w,y+h*.48);
 ctx.lineTo(x+w*.9,y+h*.92);ctx.lineTo(x+w*.1,y+h*.92);ctx.lineTo(x,y+h*.48);
 ctx.quadraticCurveTo(x,y+h*.14,x+w*.22,y);ctx.closePath();ctx.fill();

 const glass=ctx.createLinearGradient(0,y+h*.25,0,y+h*.56);
 glass.addColorStop(0,"#a8e9ff");glass.addColorStop(1,"#071c2a");
 ctx.fillStyle=glass;ctx.beginPath();ctx.roundRect(x+w*.18,y+h*.28,w*.64,h*.27,6);ctx.fill();

 ctx.fillStyle="#151515";ctx.fillRect(x+w*.36,y-10,w*.28,20);
 ctx.fillStyle="#c7c7c7";ctx.fillRect(x+w*.47,y-23,w*.06,17);
 ctx.fillStyle="#111";ctx.fillRect(x+w*.06,y+h*.70,w*.88,7);

 ctx.shadowBlur=10;ctx.shadowColor="#ff2929";ctx.fillStyle="#ff2929";
 ctx.fillRect(x+w*.12,y+h*.79,w*.22,6);ctx.fillRect(x+w*.66,y+h*.79,w*.22,6);ctx.shadowBlur=0;

 if(gameStarted&&health>0){
   ctx.fillStyle="#62dcff";
   ctx.beginPath();ctx.moveTo(x+w*.24,y+h*.9);ctx.lineTo(x+w*.31,y+h+16);ctx.lineTo(x+w*.38,y+h*.9);ctx.fill();

let muzzleFlashes=[];
let impactSparks=[];
let blastEffects=[];

function addMuzzleFlash(x,y){
  muzzleFlashes.push({x,y,life:7,max:7});
}
function addImpactSpark(x,y){
  for(let i=0;i<8;i++){
    const a=Math.random()*Math.PI*2;
    const sp=1.5+Math.random()*3.5;
    impactSparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:14,max:14});
  }
}
function addBlastEffect(x,y,big=false){
  blastEffects.push({x,y,life:big?28:20,max:big?28:20,big});
}
function updateAndDrawCombatEffects(){
  ctx.save();

  muzzleFlashes.forEach(f=>{
    const alpha=f.life/f.max;
    ctx.globalAlpha=alpha;
    const r=10+(1-alpha)*16;
    const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r);
    g.addColorStop(0,"#ffffff");g.addColorStop(.25,"#fff36b");g.addColorStop(.65,"#ff8a00");g.addColorStop(1,"rgba(255,50,0,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,r,0,Math.PI*2);ctx.fill();
    f.life--;
  });
  muzzleFlashes=muzzleFlashes.filter(f=>f.life>0);

  impactSparks.forEach(p=>{
    ctx.globalAlpha=p.life/p.max;
    ctx.fillStyle=p.life>7?"#fff176":"#ff6d00";
    ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill();
    p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94;p.life--;
  });
  impactSparks=impactSparks.filter(p=>p.life>0);

  blastEffects.forEach(b=>{
    const progress=1-b.life/b.max;
    const radius=(b.big?48:30)*progress+8;
    ctx.globalAlpha=Math.max(0,1-progress);
    const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,radius);
    g.addColorStop(0,"#fff");
    g.addColorStop(.18,"#ffe45c");
    g.addColorStop(.48,"#ff6d00");
    g.addColorStop(.75,"#d51d00");
    g.addColorStop(1,"rgba(30,30,30,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,radius,0,Math.PI*2);ctx.fill();
    b.life--;
  });
  blastEffects=blastEffects.filter(b=>b.life>0);

  ctx.globalAlpha=1;
  ctx.restore();
}

function shoot(){
 if(!gameStarted||health<=0||shopPage.style.display==="block")return;
 {
  const sx=car.x+car.width/2-3, sy=car.y;
  let target=null, best=Infinity;
  if(boss && boss.y<car.y){ target=boss; best=car.y-boss.y; }
  for(const e of enemies){
    if(e.y<car.y){
      const d=car.y-e.y;
      if(d<best){best=d;target=e;}
    }
  }
  let vx=0, vy=-bulletSpeed;
  if(target){
    const tx=target.x+target.width/2, ty=target.y+target.height/2;
    const dx=tx-(sx+3), dy=ty-sy;
    const len=Math.hypot(dx,dy)||1;
    vx=(dx/len)*bulletSpeed; vy=(dy/len)*bulletSpeed;
  }
  bullets.push({x:sx,y:sy,width:6,height:15,vx:vx,vy:vy});
}
 addMuzzleFlash(car.x+car.width/2,car.y-10);
 if(rapidFire)setTimeout(()=>{if(gameStarted&&health>0)bullets.push({x:car.x+car.width/2-3,y:car.y,width:6,height:15,vx:0,vy:-bulletSpeed});},100);
}
const fireButton = document.getElementById("fireButton");

// Multi-touch + hold-to-fire.
// Tap once = one shot. Hold = continuous fire while steering with the other finger.
let fireInterval = null;
let firingPointerId = null;

function startFiring(e) {
  e.preventDefault();
  if (firingPointerId !== null) return;

  firingPointerId = e.pointerId;
  fireButton.setPointerCapture(e.pointerId);

  shoot(); // fire immediately

  fireInterval = setInterval(() => {
    if (gameStarted && health > 0) {
      shoot();
    }
  }, getSelectedWeapon().fireRate);
}

function stopFiring(e) {
  if (firingPointerId === null) return;
  if (e && e.pointerId !== firingPointerId) return;

  if (fireInterval !== null) {
    clearInterval(fireInterval);
    fireInterval = null;
  }
  firingPointerId = null;
}

fireButton.addEventListener("pointerdown", startFiring);
fireButton.addEventListener("pointerup", stopFiring);
fireButton.addEventListener("pointercancel", stopFiring);
fireButton.addEventListener("lostpointercapture", () => stopFiring());
fireButton.addEventListener("contextmenu", e => e.preventDefault());

function drawBullets(){
 ctx.fillStyle="yellow";
 for(let i=bullets.length-1;i>=0;i--){
  let b=bullets[i];
  b.x+=(b.vx??0); b.y+=(b.vy??-bulletSpeed);
  ctx.fillRect(b.x,b.y,b.width,b.height);
  let hit=false;
  if(boss&&b.x<boss.x+boss.width&&b.x+b.width>boss.x&&b.y<boss.y+boss.height&&b.y+b.height>boss.y){
    boss.health-=bulletDamage;explosions.push({x:b.x,y:b.y,size:12,life:15});bullets.splice(i,1);hit=true;
    if(boss.health<=0){
      const reward=boss.reward,scoreReward=boss.scoreReward;
      explosions.push({x:boss.x+boss.width/2,y:boss.y+boss.height/2,size:30,life:35});
      boss=null;bossMines.length=0;bossMineTimer=0;bossWasActive=false;bossAttackWarning=0;coins+=reward;score+=scoreReward;localStorage.setItem("coins",coins);
      level=Math.floor(score/100)+1;
    }
  }
  if(hit)continue;
  for(let j=enemies.length-1;j>=0;j--){
   let e=enemies[j];
   if(b.x<e.x+e.width&&b.x+b.width>e.x&&b.y<e.y+e.height&&b.y+b.height>e.y){
    explosions.push({x:e.x+e.width/2,y:e.y+e.height/2,size:10,life:20});e.health-=bulletDamage;
    if(e.health<=0){enemies.splice(j,1);score+=e.strong?30:10;coins+=e.strong?8:3;localStorage.setItem("coins",coins);level=Math.floor(score/100)+1;}
    bullets.splice(i,1);hit=true;break;
   }
  }
  if(!hit&&b.y<0)bullets.splice(i,1);
 }
}

 for(let i=explosions.length-1;i>=0;i--){let e=explosions[i];ctx.beginPath();ctx.arc(e.x,e.y,e.size,0,Math.PI*2);ctx.fillStyle="orange";ctx.fill();e.size+=2;e.life--;if(e.life<=0)explosions.splice(i,1);}

const shopPage=document.getElementById("shopPage");
const shopGrid=document.getElementById("shopGrid");
const shopTitle=document.getElementById("shopTitle");
const shopCoins=document.getElementById("shopCoins");
let currentShop=null;

function openShop(type){
  currentShop=type;
  shopPage.style.display="block";
  steeringDirection=0;
  stopFiring();
  renderShop();
}
function closeShop(){
  shopPage.style.display="none";
  currentShop=null;
}
function renderShop(){
  shopCoins.textContent="COINS: "+coins;
  let items=[],owned=[],selected="";
  if(currentShop==="cars"){
    shopTitle.textContent="🚗 CAR GARAGE"; items=shopCars; owned=unlockedCars; selected=carColor;
  }else if(currentShop==="weapons"){
    shopTitle.textContent="🔫 WEAPON SHOP"; items=shopWeapons; owned=unlockedWeapons; selected=selectedWeapon;
  }else{
    shopTitle.textContent="🛞 TIRE SHOP"; items=shopTires; owned=unlockedTires; selected=selectedTire;
  }
  shopGrid.innerHTML="";
  items.forEach(item=>{
    const card=document.createElement("div"); card.className="shopCard";
    const preview=document.createElement("div"); preview.className="shopPreview"; preview.textContent=item.icon;
    if(currentShop==="cars") preview.style.color=item.id;
    const name=document.createElement("div"); name.className="shopName"; name.textContent=item.name;
    const stat=document.createElement("div"); stat.className="shopStat"; stat.textContent=item.stat;
    const button=document.createElement("button"); button.className="shopAction";
    const isOwned=owned.includes(item.id),isSelected=selected===item.id;
    if(isSelected){button.textContent="✅ SELECTED";button.disabled=true;}
    else if(isOwned){button.textContent="EQUIP";button.style.background="lime";}
    else{button.textContent="🔒 BUY "+item.cost;button.style.background="gold";}
    button.addEventListener("click",()=>buyOrEquip(item));
    card.append(preview,name,stat,button);shopGrid.appendChild(card);
  });
}
function buyOrEquip(item){
  let owned;
  if(currentShop==="cars") owned=unlockedCars;
  else if(currentShop==="weapons") owned=unlockedWeapons;
  else owned=unlockedTires;

  if(!owned.includes(item.id)){
    if(coins<item.cost){alert("🔒 You need "+(item.cost-coins)+" more coins!");return;}
    coins-=item.cost; owned.push(item.id); localStorage.setItem("coins",coins);
  }
  if(currentShop==="cars"){
    carColor=item.id;
    localStorage.setItem("selectedCar",carColor);
    localStorage.setItem("unlockedCars",JSON.stringify(unlockedCars));
  }else if(currentShop==="weapons"){
    selectedWeapon=item.id;
    localStorage.setItem("selectedWeapon",selectedWeapon);
    localStorage.setItem("unlockedWeapons",JSON.stringify(unlockedWeapons));
    refreshWeaponStats();
  }else{
    selectedTire=item.id;
    localStorage.setItem("selectedTire",selectedTire);
    localStorage.setItem("unlockedTires",JSON.stringify(unlockedTires));
  }
  renderShop();
}

 let cost=Math.floor(75*Math.pow(1.7,weaponLevel-1));
 if(coins>=cost){coins-=cost;weaponLevel++;refreshWeaponStats();localStorage.setItem("coins",coins);localStorage.setItem("weaponLevel",weaponLevel);updateWeaponButton();alert("🔫 WEAPON UPGRADED!\\n\\nWeapon Level: "+weaponLevel+"\\nDamage: "+bulletDamage+"\\nBullet Speed: "+bulletSpeed);}
 else alert("🔒 Not enough coins!\\n\\nYou need "+(cost-coins)+" more coins.");
});
function updateWeaponButton(){
 document.getElementById("weaponButton").textContent=weaponLevel>=10?"🏆 WEAPON MAX":"🔫 WEAPON "+Math.floor(75*Math.pow(1.7,weaponLevel-1));
}
document.getElementById("garageButton").addEventListener("click",function(){
 const cars={"1":{name:"Red Racer",color:"red",cost:0},"2":{name:"Blue Speedster",color:"blue",cost:100},"3":{name:"Green Monster",color:"green",cost:250},"4":{name:"Orange Blazer",color:"orange",cost:500},"5":{name:"Purple Phantom",color:"purple",cost:1000},"6":{name:"Gold Champion",color:"gold",cost:2500}};
 let t="🚗 BATTLE RACERS GARAGE 🚗\\nCOINS: "+coins+"\\n\\n";
 for(let n in cars){let c=cars[n],owned=unlockedCars.includes(c.color);t+=n+" - "+c.name+(c.color===carColor?" ✅ SELECTED":owned?" 🔓 OWNED":" 🔒 "+c.cost+" COINS")+"\\n";}
 let choice=prompt(t+"\\nEnter 1, 2, 3, 4, 5, or 6:");if(!cars[choice])return;let c=cars[choice];
 if(unlockedCars.includes(c.color)){carColor=c.color;localStorage.setItem("selectedCar",carColor);alert("🏁 "+c.name+" selected!");return;}
 if(coins>=c.cost){coins-=c.cost;carColor=c.color;unlockedCars.push(c.color);localStorage.setItem("coins",coins);localStorage.setItem("unlockedCars",JSON.stringify(unlockedCars));localStorage.setItem("selectedCar",carColor);alert("🎉 "+c.name+" unlocked!");}
 else alert("🔒 You need "+(c.cost-coins)+" more coins!");
});

// Smooth steering wheel control
const steeringWheel = document.getElementById("steeringWheel");
let steeringDirection = 0;
let steeringPointerId = null;

function setSteeringFromPointer(e) {
  const rect = steeringWheel.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const distance = e.clientX - centerX;
  const deadZone = rect.width * 0.12;
  if (distance < -deadZone) steeringDirection = -1;
  else if (distance > deadZone) steeringDirection = 1;
  else steeringDirection = 0;
}

steeringWheel.addEventListener("pointerdown", e => {
  steeringPointerId = e.pointerId;
  steeringWheel.setPointerCapture(e.pointerId);
  setSteeringFromPointer(e);
  e.preventDefault();
});
steeringWheel.addEventListener("pointermove", e => {
  if (e.pointerId === steeringPointerId) {
    setSteeringFromPointer(e);
    e.preventDefault();
  }
});
function stopSteering(e) {
  if (steeringPointerId === null || !e || e.pointerId === steeringPointerId) {
    steeringDirection = 0;
    steeringPointerId = null;
  }
}
steeringWheel.addEventListener("pointerup", stopSteering);
steeringWheel.addEventListener("pointercancel", stopSteering);
steeringWheel.addEventListener("lostpointercapture", () => {
  steeringDirection = 0;
  steeringPointerId = null;
});

function updateSteering() {
  if (gameStarted && health > 0 && steeringDirection !== 0) {
    const smoothSpeed = 3 + (carUpgradeLevel - 1) * 0.35 + getSelectedTire().handling;
    car.x += steeringDirection * smoothSpeed;
    car.x = Math.max(0, Math.min(canvas.width - car.width, car.x));
  }
}
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")car.x-=car.speed;if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")car.x+=car.speed;car.x=Math.max(0,Math.min(canvas.width-car.width,car.x));});


const pauseButton=document.getElementById("pauseButton");
pauseButton.addEventListener("click",e=>{
  e.stopPropagation();
  if(!gameStarted || health<=0) return;
  paused=!paused;
  pauseButton.textContent=paused?"▶":"⏸";
  if(!paused) gameLoop();
});

function resetGame(){
 paused=false;pauseButton.textContent="⏸";
 health=3;score=0;level=1;lastBossLevel=0;boss=null;enemies.length=0;bullets.length=0;enemyBullets.length=0;enemyShotTimer=0;bossMines.length=0;bossMineTimer=0;bossWasActive=false;bossAttackWarning=0;explosions.length=0;powerUps.length=0;rapidFire=false;rapidFireTimer=0;
 car.x=canvas.width/2-car.width/2;
}
function gameLoop(){
 if(!gameStarted){
  drawRoad();
  ctx.fillStyle="rgba(0,0,0,.48)";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="white";ctx.textAlign="center";
  ctx.font="bold 46px Arial";ctx.fillText("🏁 BATTLE RACERS 🏁",canvas.width/2,canvas.height/2-75);
  ctx.font="bold 28px Arial";ctx.fillText("TAP TO PLAY",canvas.width/2,canvas.height/2);
  ctx.font="bold 16px Arial";ctx.fillText("Steer • Fire • Upgrade • Survive the Boss",canvas.width/2,canvas.height/2+38);
  ctx.fillText("BEST SCORE  "+bestScore,canvas.width/2,canvas.height/2+68);
  return;
}
if(paused){
  drawRoad();drawCar();
  ctx.fillStyle="rgba(0,0,0,.58)";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="white";ctx.textAlign="center";ctx.font="bold 42px Arial";
  ctx.fillText("PAUSED",canvas.width/2,canvas.height/2-10);
  ctx.font="bold 18px Arial";ctx.fillText("Tap ▶ to continue",canvas.width/2,canvas.height/2+30);
  return;
}
 if(rapidFire&&--rapidFireTimer<=0)rapidFire=false;
 updateSteering();
 spawnBoss();
 drawRoad();drawEnemies();drawBoss();drawExplosions();drawCar();drawBullets();updateEnemyShooting();drawEnemyBullets();updateBossMines();drawBossAttackWarning();drawBossMines();drawPowerUps();
 ctx.textAlign="left";ctx.fillStyle="white";ctx.font="bold 24px Arial";
 ctx.save();
ctx.fillStyle="rgba(4,12,20,.72)";
ctx.beginPath();ctx.roundRect(24,42,138,108,12);ctx.fill();
ctx.strokeStyle="rgba(75,190,255,.9)";ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle="white";ctx.textAlign="left";ctx.font="bold 13px Arial";
ctx.fillText("SCORE   "+score,34,61);
ctx.fillText("HEALTH  "+health,34,78);
ctx.fillText("LEVEL   "+level,34,95);
ctx.fillText("COINS   "+coins,34,112);
ctx.fillText("CAR     LV "+carUpgradeLevel,34,129);
ctx.fillText("GUN     LV "+weaponLevel,34,146);
ctx.restore();
 if(bossWarningTimer>0){bossWarningTimer--;ctx.textAlign="center";ctx.fillStyle="red";ctx.font="bold 34px Arial";ctx.fillText("⚠️ BOSS BATTLE! ⚠️",canvas.width/2,canvas.height/2);}
 if(health<=0){
  if(score>bestScore){bestScore=score;localStorage.setItem("bestScore",bestScore);}
  ctx.fillStyle="rgba(0,0,0,.62)";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="white";ctx.textAlign="center";ctx.font="bold 44px Arial";
  ctx.fillText("GAME OVER",canvas.width/2,canvas.height/2-55);
  ctx.font="bold 20px Arial";
  ctx.fillText("Score: "+score+"   •   Best: "+bestScore,canvas.width/2,canvas.height/2-12);
  ctx.fillText("Coins: "+coins+"   •   Level: "+level,canvas.width/2,canvas.height/2+20);
  ctx.font="bold 24px Arial";ctx.fillText("TAP TO RESTART",canvas.width/2,canvas.height/2+68);
  return;
}
 updateAndDrawCombatEffects();
 requestAnimationFrame(gameLoop);
}
canvas.addEventListener("click",function(){if(!gameStarted){gameStarted=true;gameLoop();return;}if(health<=0){resetGame();gameLoop();}});
document.addEventListener("keydown",e=>{if(e.key.toLowerCase()==="r"&&health<=0){resetGame();gameLoop();}});
function resizeGame(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
  car.y=canvas.height-150;
  car.x=Math.max(0,Math.min(canvas.width-car.width,car.x));
}
window.addEventListener("resize",resizeGame);
window.addEventListener("orientationchange",()=>setTimeout(resizeGame,150));
updateUpgradeButton();updateWeaponButton();gameLoop();
</script>
