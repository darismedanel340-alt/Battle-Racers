<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Racers</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: Arial;
}

canvas {
  display: block;
  margin: auto;
  background: #333;
}
#title {
    position: fixed;
    top: 10px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 24px;
    font-weight: bold;
    z-index: 100;
}

#fireButton {
    position: fixed;
    bottom: 30px;
    right: 25px;
    z-index: 100;
    background: red;
    color: white;
    border: 3px solid white;
    border-radius: 50%;
    width: 80px;
    height: 80px;
    font-size: 18px;
    font-weight: bold;
}
  #upgradeButton {
  position: fixed;
  bottom: 125px;
  right: 25px;
  z-index: 100;
  background: gold;
  color: black;
  border: 3px solid white;
  border-radius: 15px;
  width: 120px;
  height: 55px;
  font-size: 16px;
  font-weight: bold;
  }
  #garageButton {
  position: fixed;
  bottom: 190px;
  right: 25px;
  z-index: 100;
  background: blue;
  color: white;
  border: 3px solid white;
  border-radius: 15px;
  width: 120px;
  height: 55px;
  font-size: 16px;
  font-weight: bold;
  }
</style>
</head>

<body>

<div id="title">🏁 BATTLE RACERS 🏁</div>
<canvas id="game"></canvas>
<button id="fireButton">🔥 FIRE</button>
  <button id="upgradeButton">⬆️ UPGRADE</button>
  <button id="garageButton">🚗 GARAGE</button>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const car = {
  x: canvas.width / 2 - 25,
  y: canvas.height - 150,
  width: 50,
  height: 90,
  speed: 8
};

const bullets = [];
let score = 0;
  let health = 3;
  let level = 1;
  let gameStarted = false;
  let rapidFire = false;
let rapidFireTimer = 0;
  let coins = Number(localStorage.getItem("coins")) || 0;
let carUpgradeLevel = Number(localStorage.getItem("carUpgradeLevel")) || 1;
let carColor = localStorage.getItem("selectedCar") || "red";
let unlockedCars = JSON.parse(localStorage.getItem("unlockedCars")) || ["red"];

const carColors = ["red", "blue", "green", "orange", "purple", "gold"];

let bulletSpeed = 10 + ((carUpgradeLevel - 1) * 2);
let bulletDamage = 1 + (carUpgradeLevel - 1);
car.speed = 8 + (carUpgradeLevel - 1);
  
  const enemies = [];
  
const explosions = [];
  const powerUps = [];
function spawnEnemy() {
  if (!gameStarted || health <= 0) return;
  
 const isStrong = Math.random() < 0.3;   
  enemies.push({
        x: Math.random() * (canvas.width - 50),
        y: -100,
        width: 50,
        height: 90,
       speed: 3 + Math.min(score / 100, 5),
        health: isStrong ? 3 : 1,
strong: isStrong,
      
    });
}
function spawnPowerUp() {
  if (!gameStarted || health <= 0) return;

  const type = Math.random() < 0.5 ? "rapid" : "health";
  powerUps.push({
  x: Math.random() * (canvas.width - 30),
  y: -30,
  width: 30,
  height: 30,
  speed: 3,
type: type
});
}
  
setInterval(spawnEnemy, 1500);
  setInterval(spawnPowerUp, 8000);
function drawEnemies() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    let enemy = enemies[i];

    enemy.y += enemy.speed;

    // Collision with player's car
    if (
      enemy.x < car.x + car.width &&
      enemy.x + enemy.width > car.x &&
      enemy.y < car.y + car.height &&
      enemy.y + enemy.height > car.y
    ) {
      // Monster cars cause 2 damage
      health -= enemy.strong ? 2 : 1;

      if (health <= 0) {
        health = 0;
      }

      enemies.splice(i, 1);
      continue;
    }

    // =========================
    // 👹 MONSTER CAR
    // =========================
    if (enemy.strong) {

      // Monster body
      ctx.fillStyle = "#8B0000";
      ctx.fillRect(
        enemy.x - 5,
        enemy.y,
        enemy.width + 10,
        enemy.height
      );

      // Armor plates
      ctx.fillStyle = "#333";
      ctx.fillRect(enemy.x + 5, enemy.y + 20, 40, 12);
      ctx.fillRect(enemy.x + 5, enemy.y + 55, 40, 12);

      // Large monster wheels
      ctx.fillStyle = "black";

      ctx.fillRect(enemy.x - 10, enemy.y + 10, 10, 25);
      ctx.fillRect(enemy.x + enemy.width, enemy.y + 10, 10, 25);

      ctx.fillRect(enemy.x - 10, enemy.y + 55, 10, 25);
      ctx.fillRect(enemy.x + enemy.width, enemy.y + 55, 10, 25);

      // Monster windshield
      ctx.fillStyle = "#111";
      ctx.fillRect(enemy.x + 8, enemy.y + 35, 34, 20);

      // Evil headlights
      ctx.fillStyle = "yellow";
      ctx.fillRect(enemy.x + 5, enemy.y + 3, 12, 7);
      ctx.fillRect(enemy.x + 33, enemy.y + 3, 12, 7);

      // Spikes
      ctx.fillStyle = "silver";

      ctx.beginPath();
      ctx.moveTo(enemy.x, enemy.y + 15);
      ctx.lineTo(enemy.x - 12, enemy.y + 25);
      ctx.lineTo(enemy.x, enemy.y + 30);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(enemy.x + enemy.width, enemy.y + 15);
      ctx.lineTo(enemy.x + enemy.width + 12, enemy.y + 25);
      ctx.lineTo(enemy.x + enemy.width, enemy.y + 30);
      ctx.fill();

      // MONSTER label
      ctx.fillStyle = "white";
      ctx.font = "bold 10px Arial";
      ctx.textAlign = "center";
      ctx.fillText(
        "MONSTER",
        enemy.x + enemy.width / 2,
        enemy.y + 82
      );

      // Health bar background
      ctx.fillStyle = "black";
      ctx.fillRect(enemy.x, enemy.y - 12, 50, 7);

      // Health bar
      ctx.fillStyle = "lime";
      ctx.fillRect(
        enemy.x,
        enemy.y - 12,
        Math.max(0, enemy.health / 3) * 50,
        7
      );

    } else {

      // =========================
      // 🚙 NORMAL ENEMY CAR
      // =========================

      ctx.fillStyle = "blue";
      ctx.fillRect(
        enemy.x,
        enemy.y,
        enemy.width,
        enemy.height
      );

      // Wheels
      ctx.fillStyle = "black";

      ctx.fillRect(enemy.x - 5, enemy.y + 15, 5, 20);
      ctx.fillRect(enemy.x + enemy.width, enemy.y + 15, 5, 20);

      ctx.fillRect(enemy.x - 5, enemy.y + 55, 5, 20);
      ctx.fillRect(enemy.x + enemy.width, enemy.y + 55, 5, 20);

      // Window
      ctx.fillStyle = "black";
      ctx.fillRect(enemy.x + 10, enemy.y + 25, 30, 25);

      // Headlights
      ctx.fillStyle = "white";
      ctx.fillRect(enemy.x + 5, enemy.y + 3, 10, 6);
      ctx.fillRect(
        enemy.x + enemy.width - 15,
        enemy.y + 3,
        10,
        6
      );
    }

    // Remove enemies after they leave screen
    if (enemy.y > canvas.height) {
      enemies.splice(i, 1);
    }
  }
}
  
function drawRoad() {
  ctx.fillStyle = "#555";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "white";
  ctx.lineWidth = 5;
  ctx.setLineDash([30, 30]);

  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(canvas.width / 2, canvas.height);
  ctx.stroke();

  ctx.setLineDash([]);
}

function drawCar() {
  ctx.fillStyle = carColor;
  ctx.fillRect(car.x, car.y, car.width, car.height);
  ctx.fillStyle = "black";
ctx.fillRect(car.x - 5, car.y + 15, 5, 20);
ctx.fillRect(car.x + car.width, car.y + 15, 5, 20);
ctx.fillRect(car.x - 5, car.y + 55, 5, 20);
ctx.fillRect(car.x + car.width, car.y + 55, 5, 20);

  ctx.fillStyle = "black";
  ctx.fillRect(car.x + 10, car.y + 15, 30, 25);

  ctx.fillStyle = "yellow";
  ctx.fillRect(car.x + 20, car.y - 12, 10, 20);
  ctx.fillStyle = "white";
ctx.fillRect(car.x + 5, car.y + 3, 10, 6);
ctx.fillRect(car.x + car.width - 15, car.y + 3, 10, 6);
}

function shoot() {
  bullets.push({
    x: car.x + car.width / 2 - 3,
    y: car.y,
    width: 6,
    height: 15
  });

  if (rapidFire) {
    setTimeout(() => {
      bullets.push({
        x: car.x + car.width / 2 - 3,
        y: car.y,
        width: 6,
        height: 15
      });
    }, 100);
  }
}
document.getElementById("fireButton").addEventListener("click", shoot);
  document.getElementById("upgradeButton").addEventListener("click", function() {
 let upgradeCost = Math.floor(100 * Math.pow(1.8, carUpgradeLevel - 1));
    document.getElementById("upgradeButton").textContent = "⬆ UPGRADE " + upgradeCost + " COINS";
    if (carUpgradeLevel < 10 && coins >= upgradeCost) {
    coins -= upgradeCost;
    carUpgradeLevel += 1;

      localStorage.setItem("coins", coins);
localStorage.setItem("carUpgradeLevel", carUpgradeLevel);
      let nextCost = Math.floor(100 * Math.pow(1.8, carUpgradeLevel - 1));
if (carUpgradeLevel >= 10) {
  document.getElementById("upgradeButton").textContent = "🏆 MAX UPGRADE";
} else {
  document.getElementById("upgradeButton").textContent = "⬆ UPGRADE " + nextCost + " COINS";
}
    car.speed += 1;
    bulletSpeed += 2;
    bulletDamage += 1;
  }
});
  document.getElementById("garageButton").addEventListener("click", function() {

  const cars = {
    "1": { name: "Red Racer", color: "red", cost: 0 },
    "2": { name: "Blue Speedster", color: "blue", cost: 100 },
    "3": { name: "Green Monster", color: "green", cost: 250 },
    "4": { name: "Orange Blazer", color: "orange", cost: 500 },
    "5": { name: "Purple Phantom", color: "purple", cost: 1000 },
    "6": { name: "Gold Champion", color: "gold", cost: 2500 }
  };

  let garageText = "🚗 BATTLE RACERS GARAGE 🚗\n";
  garageText += "COINS: " + coins + "\n\n";

  for (let number in cars) {
    let c = cars[number];
    let owned = unlockedCars.includes(c.color);

    garageText += number + " - " + c.name;

    if (c.color === carColor) {
      garageText += " ✅ SELECTED";
    } else if (owned) {
      garageText += " 🔓 OWNED";
    } else {
      garageText += " 🔒 " + c.cost + " COINS";
    }

    garageText += "\n";
  }

  garageText += "\nEnter 1, 2, 3, 4, 5, or 6:";

  let choice = prompt(garageText);

  if (!cars[choice]) return;

  let selectedCar = cars[choice];

  // Already owned — select for free
  if (unlockedCars.includes(selectedCar.color)) {
    carColor = selectedCar.color;
    localStorage.setItem("selectedCar", carColor);
    alert("🏁 " + selectedCar.name + " selected!");
    return;
  }

  // Buy locked car
  if (coins >= selectedCar.cost) {
    coins -= selectedCar.cost;
    carColor = selectedCar.color;
localStorage.setItem("coins", coins);
    unlockedCars.push(selectedCar.color);

    localStorage.setItem(
      "unlockedCars",
      JSON.stringify(unlockedCars)
    );

    localStorage.setItem("selectedCar", carColor);

    alert("🎉 " + selectedCar.name + " unlocked!");
  } else {
    alert(
      "🔒 You need " +
      (selectedCar.cost - coins) +
      " more coins!"
    );
  }
});
  
function drawBullets() {
  ctx.fillStyle = "yellow";

  for (let i = bullets.length - 1; i >= 0; i--) {
    let bullet = bullets[i];
    bullet.y -= bulletSpeed;

    ctx.fillRect(
      bullet.x,
      bullet.y,
      bullet.width,
      bullet.height
    );

    let hit = false;

    for (let j = enemies.length - 1; j >= 0; j--) {
      let enemy = enemies[j];

      if (
        bullet.x < enemy.x + enemy.width &&
        bullet.x + bullet.width > enemy.x &&
        bullet.y < enemy.y + enemy.height &&
        bullet.y + bullet.height > enemy.y
      ) {
        explosions.push({
    x: enemy.x + enemy.width / 2,
    y: enemy.y + enemy.height / 2,
    size: 10,
    life: 20
});
       enemy.health -= bulletDamage;

if (enemy.health <= 0) {
  enemies.splice(j, 1);
  score += enemy.strong ? 30 : 10;
  coins += enemy.strong ? 3 : 1;
  localStorage.setItem("coins", coins);
  level = Math.floor(score / 100) + 1;
}
        bullets.splice(i, 1);
        hit = true;
        break;
      }
    }

    if (!hit && bullet.y < 0) {
      bullets.splice(i, 1);
    }
  }
}
  function drawExplosions() {
    for (let i = explosions.length - 1; i >= 0; i--) {
        let explosion = explosions[i];

        ctx.beginPath();
        ctx.arc(explosion.x, explosion.y, explosion.size, 0, Math.PI * 2);
        ctx.fillStyle = "orange";
        ctx.fill();

        explosion.size += 2;
        explosion.life--;

        if (explosion.life <= 0) {
            explosions.splice(i, 1);
        }
    }
}

  function drawPowerUps() {
for (let i = powerUps.length - 1; i >= 0; i--) {
  let powerUp = powerUps[i];
  powerUp.y += powerUp.speed;
  ctx.fillStyle = powerUp.type === "rapid" ? "yellow" : "lime";
ctx.fillRect(powerUp.x, powerUp.y, powerUp.width, powerUp.height);
  ctx.fillStyle = "black";
ctx.font = "20px Arial";
ctx.textAlign = "center";
ctx.fillText(
  powerUp.type === "rapid" ? "⚡" : "❤",
  powerUp.x + powerUp.width / 2,
  powerUp.y + 22
);
   if (
    powerUp.x < car.x + car.width &&
  powerUp.x + powerUp.width > car.x &&
  powerUp.y < car.y + car.height &&
  powerUp.y + powerUp.height > car.y
) {
  if (powerUp.type === "rapid") {
  rapidFire = true;
  rapidFireTimer = 300;
} else if (powerUp.type === "health") {
  health = Math.min(health + 1, 5);
}
  powerUps.splice(i, 1);
}
}
}
document.addEventListener("touchmove", function(e) {
  const touch = e.touches[0];
  car.x = touch.clientX - car.width / 2;
  e.preventDefault();
}, { passive: false });
document.addEventListener("keydown", function(e) {
  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
    car.x -= car.speed;
  }

  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
    car.x += car.speed;
  }

  car.x = Math.max(0, Math.min(canvas.width - car.width, car.x));
});
  
function gameLoop() {
  if (!gameStarted) {
  drawRoad();

  ctx.fillStyle = "white";
  ctx.font = "bold 48px Arial";
  ctx.textAlign = "center";
  ctx.fillText("BATTLE RACERS", canvas.width / 2, canvas.height / 2 - 60);

  ctx.font = "bold 30px Arial";
  ctx.fillText("TAP TO PLAY", canvas.width / 2, canvas.height / 2 + 20);
    ctx.font = "bold 18px Arial";
ctx.fillText("Choose your racer in the GARAGE!", canvas.width / 2, canvas.height / 2 + 60);
  return;
    }
if (rapidFire) {
  rapidFireTimer--;

  if (rapidFireTimer <= 0) {
    rapidFire = false;
  }
}
  drawRoad();
  drawEnemies();
  drawExplosions();
  drawCar();
  drawBullets();
  drawPowerUps();
  
  ctx.fillStyle = "white";
ctx.font = "bold 24px Arial";
ctx.fillText("SCORE: " + score, 20, 50);
  ctx.fillText("HEALTH: " + health, 20, 80);
  ctx.fillText("LEVEL: " + level, 20, 110);
  ctx.fillText("COINS: " + coins, 20, 140);
  ctx.fillText("CAR: LV " + carUpgradeLevel, 20, 170);

  if (health <= 0) {
  ctx.fillStyle = "white";
  ctx.font = "bold 48px Arial";
  ctx.textAlign = "center";
  ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
  
  ctx.font = "bold 24px Arial";
ctx.fillText("Tap to Restart", canvas.width / 2, canvas.height / 2 + 50);
  return;
}
  requestAnimationFrame(gameLoop);
}
document.addEventListener("keydown", function(event) {
  if (event.key.toLowerCase() === "r" && health <= 0) {
    health = 3;
    score = 0;
    enemies.length = 0;
    bullets.length = 0;
    explosions.length = 0;
    gameLoop();
  }
});
  
  canvas.addEventListener("click", function() {
  if (!gameStarted) {
  gameStarted = true;
  gameLoop();
  return;
}
    
    if (health <= 0) {
    health = 3;
    score = 0;
    enemies.length = 0;
    bullets.length = 0;
    explosions.length = 0;
      powerUps.length = 0;
      rapidFire = false;
rapidFireTimer = 0;
      
    gameLoop();
  }
});
  let startingUpgradeCost = Math.floor(100 * Math.pow(1.8, carUpgradeLevel - 1));

if (carUpgradeLevel >= 10) {
  document.getElementById("upgradeButton").textContent = "🏆 MAX UPGRADE";
} else {
  document.getElementById("upgradeButton").textContent =
    "⬆ UPGRADE " + startingUpgradeCost + " COINS";
}
  
gameLoop();
</script>

</body>
</html>
